<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222a2a">
<meta name="description" content="Explorá y compará el presupuesto provincial de Jujuy de 2025, 2026 y 2027.">
<title>Presupuesto Jujuy</title>
<style>:root {
  color-scheme: dark;
  --iron: #222a2a;
  --ink: #192121;
  --aqua: #4fbbbc;
  --rust: #ec4624;
  --orange: #f39120;
  --cream: #e2dac2;
  --paper: #f6efe1;
  --muted: #c5c7b9;
  --border: #46524e;
  --field: #303b38;
  font-family: Inter, "Trebuchet MS", Arial, sans-serif;
  color: var(--paper);
  background: var(--ink);
}
* { box-sizing: border-box; }
body, h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled, select:disabled { cursor: default; opacity: .58; }
a { color: inherit; text-underline-offset: .22em; }
button, a, select, input, summary { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
small { font-size: .81rem; }
h1 { font-size: clamp(1.5rem, 3.3vw, 2.7rem); letter-spacing: -.055em; line-height: 1; }
h2 { font-size: clamp(1.26rem, 2vw, 1.65rem); letter-spacing: -.035em; line-height: 1.15; }
h3 { font-size: 1.04rem; line-height: 1.2; }
.muted { color: var(--muted); line-height: 1.4; }
.price { font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon { width: 1.25rem; height: 1.25rem; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.skip { position: fixed; top: 4px; left: 8px; transform: translateY(-150%); padding: 10px; background: var(--cream); color: var(--ink); z-index: 6; }
.skip:focus { transform: none; }

#site { max-width: 1430px; margin: auto; padding: 0 clamp(15px, 3.5vw, 48px) 44px; }
.top { min-height: 83px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { display: inline-flex; width: 37px; height: 37px; flex: 0 0 37px; justify-content: center; align-items: flex-end; gap: 3px; padding: 9px; border-radius: 12px; background: var(--orange); color: var(--ink); }
.brand-mark i { background: currentColor; width: 4px; height: 6px; border-radius: 1px; }
.brand-mark i:nth-child(2) { height: 11px; }
.brand-mark i:nth-child(3) { height: 16px; }
.top-actions, .money-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top-actions { flex-wrap: nowrap; }
.top-actions .secondary { border-color: var(--cream); color: var(--cream); }
.round, .secondary, .primary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 999px; border: 1px solid var(--border); min-height: 40px; font-size: .87rem; font-weight: 800; }
.round { width: 40px; flex: 0 0 40px; background: var(--cream); color: var(--ink); }
.secondary { background: transparent; padding: 7px 13px; }
.primary { padding: 8px 15px; border-color: transparent; background: var(--orange); color: var(--ink); }
.secondary:hover, .round:hover, .primary:hover { filter: brightness(1.08); }
main { display: grid; gap: 19px; padding-top: 19px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.section-heading p { margin-top: 5px; font-size: .84rem; }
.panel { min-width: 0; border: 1px solid var(--border); border-radius: 17px; background: var(--iron); }
.years, .units { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--field); }
.year, .pill { border: 0; min-height: 34px; padding: 5px 12px; border-radius: 999px; background: transparent; font-size: .84rem; font-weight: 800; white-space: nowrap; }
.year[aria-pressed=true] { color: var(--ink); background: var(--cream); }
.pill[aria-pressed=true] { color: var(--ink); background: var(--orange); }
.base-picker { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .83rem; }
.base-picker select { width: auto; min-height: 36px; }

.budget-summary { display: grid; gap: 8px; }
.account-list { display: grid; gap: 5px; }
.account-row { display: grid; align-items: center; grid-template-columns: 79px minmax(0, 1fr) 20px minmax(0, 1fr) 20px minmax(0, 1fr); gap: 8px; padding: 5px 8px 5px 12px; border: 1px solid var(--border); border-radius: 13px; background: var(--iron); }
.account-year { display: grid; gap: 2px; }
.account-year b { font-size: 1.2rem; }
.account-year small { color: var(--muted); }
.account-row:last-child .account-year b { color: var(--cream); }
.account-sign { text-align: center; font-weight: 800; color: var(--cream); }
.tone-aqua { --tone: var(--aqua); }
.tone-orange { --tone: var(--orange); }
.tone-cream { --tone: var(--cream); }
.tone-rust { --tone: var(--rust); }
.account-term { min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 7px; text-align: left; color: var(--paper); background: color-mix(in srgb, var(--tone) 7%, var(--ink)); border: 1px solid color-mix(in srgb, var(--tone) 26%, var(--border)); border-radius: 9px; }
.account-term:hover { border-color: var(--tone); }
.account-icon, .chart-icon { width: 29px; height: 29px; display: inline-grid; place-items: center; flex: 0 0 29px; border-radius: 9px; background: var(--tone); color: var(--ink); }
.account-icon .icon, .chart-icon .icon { width: 17px; height: 17px; }
.account-value { display: grid; gap: 2px; min-width: 0; }
.account-value span { color: var(--cream); font-size: .75rem; line-height: 1.1; }
.account-value b { font-size: clamp(.94rem, 1.75vw, 1.23rem); letter-spacing: -.025em; }
.account-term:last-child .account-value span { color: var(--tone); }

.explorer-layout { min-width: 0; display: grid; grid-template-columns: minmax(217px, .34fr) minmax(0, 1fr); align-items: start; gap: 14px; }
.analytics { min-width: 0; display: grid; gap: 10px; }
.selection-heading h2 { overflow-wrap: anywhere; }
.filter-button { flex-shrink: 0; background: var(--rust); border-color: var(--rust); color: #151b1b; }
.filter-button .icon { width: 16px; height: 16px; }
.picker summary, .breakdown summary, .indicators>summary { cursor: pointer; font-weight: 800; }
.picker>summary, .breakdown>summary, .indicators>summary { list-style: none; display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 12px 15px; }
.picker>summary::-webkit-details-marker, .breakdown>summary::-webkit-details-marker, .indicators>summary::-webkit-details-marker { display: none; }
.picker>summary::after, .breakdown>summary::after, .indicators>summary::after { content: ''; width: 7px; height: 7px; margin-left: auto; border-right: 2px solid var(--aqua); border-bottom: 2px solid var(--aqua); transform: rotate(45deg); }
.picker[open]>summary::after, .breakdown[open]>summary::after, .indicators[open]>summary::after { transform: rotate(225deg); }
.picker>summary { font-size: 1.21rem; }
.picker-current { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .83rem; color: var(--cream); font-weight: 400; }
.picker-body { padding: 0 11px 11px; }
.search-label { display: flex; align-items: center; gap: 7px; background: var(--ink); padding: 0 9px; border: 1px solid var(--border); border-radius: 9px; }
.search-label:focus-within { outline: 2px solid var(--aqua); outline-offset: 2px; }
.search-label input { min-width: 0; width: 100%; min-height: 38px; border: 0; outline: 0; background: transparent; color: var(--paper); font-size: 1rem; }
.search-label input::placeholder { color: var(--muted); }
.search-label .icon { width: 17px; height: 17px; color: var(--aqua); }
.tree-scroll { max-height: min(66vh, 580px); overflow: auto; padding: 8px 3px 0; scrollbar-width: thin; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 10px; padding-left: 5px; border-left: 1px solid var(--border); }
.tree-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: stretch; border-radius: 8px; }
.tree-row.is-selected { background: var(--orange); color: var(--ink); }
.tree-row:not(.is-selected):hover { background: var(--field); }
.branch-toggle, .pick-topic { background: transparent; border: 0; }
.branch-toggle { justify-self: stretch; color: var(--aqua); font-size: 1.13rem; }
.is-selected .branch-toggle { color: var(--ink); }
.pick-topic { min-height: 36px; min-width: 0; padding: 5px 5px 5px 0; text-align: left; overflow-wrap: anywhere; font-size: .9rem; }
.branch-label { align-self: center; padding: 5px 5px 5px 0; color: var(--muted); font-size: .88rem; }
.tree>li>.tree-row .pick-topic, .tree-row.is-selected .pick-topic { font-weight: 800; }
.empty-search { padding: 8px 3px; font-size: .9rem; }

.chart-grid { min-width: 0; display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(225px, 1fr); gap: 10px; align-items: stretch; }
.chart-card { padding: 15px; }
.chart-grid:has(> :only-child) { grid-template-columns: minmax(0, 1fr); }
.chart-card h3, .share-panel h3:first-child { display: flex; align-items: center; gap: 8px; }
.chart-empty { margin: 16px 0; }
.budget-chart { display: block; width: 100%; max-height: 265px; margin: 10px 0 2px; }
.budget-chart text { fill: var(--muted); font-size: 14px; }
.budget-chart .gridline, .series-chart .gridline { stroke: var(--border); stroke-width: .7; }
.budget-chart .zero-line { stroke: var(--muted); stroke-width: 1.4; }
.budget-line { stroke: var(--orange); stroke-width: 3; }
.budget-line.projected { stroke-dasharray: 5 5; }
.budget-dot { fill: var(--orange); stroke: var(--ink); stroke-width: 1.5; }
.budget-dot.projected { fill: var(--iron); stroke: var(--orange); stroke-width: 2.5; }
.compare-years { display: grid; grid-template-columns: repeat(var(--year-count), minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
.compare-year { min-width: 0; padding: 7px 6px; border-top: 1px solid var(--border); }
.compare-year b { display: block; margin: 4px 0; font-size: clamp(.89rem, 1.32vw, 1.14rem); letter-spacing: -.025em; white-space: normal; overflow-wrap: anywhere; }
.compare-year small { display: block; }
.year-tag { color: var(--cream); font-size: .78rem; font-weight: 800; }
.change { color: var(--aqua); font-weight: 750; font-variant-numeric: tabular-nums; }
.change small { display: inline; font-size: .72rem; font-weight: 400; }
.note { border-left: 3px solid var(--orange); padding: 3px 0 3px 9px; margin-top: 8px; color: var(--muted); font-size: .85rem; line-height: 1.42; }
.share-panel { display: grid; align-content: start; gap: 6px; padding: 15px; }
.share-panel>p { font-size: .85rem; }
.pie-mark { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 50%; background: conic-gradient(currentColor 0 25%, transparent 25%); }
.share-year { display: grid; gap: 4px; padding: 6px 0 1px; border-top: 1px solid var(--border); }
.share-panel .share-year h3 { display: block; font-size: .91rem; }
.share-year h3 span { font-size: .75rem; font-weight: 400; }
.share-year>p { font-size: .85rem; }
.share-item { display: grid; grid-template-columns: 51px minmax(0, 1fr); align-items: center; gap: 7px; font-size: .84rem; line-height: 1.35; }
.budget-pie { position: relative; display: grid; place-items: center; width: 51px; min-height: 51px; }
.budget-pie svg { position: absolute; inset: 0; height: 100%; width: 100%; fill: none; stroke-width: 9; }
.pie-rest { stroke: var(--field); }
.pie-part { stroke: var(--aqua); }
.budget-pie span { position: relative; font-size: .70rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.project-card { padding: 13px 15px; }
.project-values { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 9px; margin-top: 10px; }
.project-values div { display: grid; gap: 5px; padding: 10px; border: 1px solid var(--border); border-radius: 9px; }
.project-values .price { white-space: normal; overflow-wrap: anywhere; font-size: 1.16rem; }
.breakdown-content, .social-body { display: grid; gap: 12px; padding: 0 15px 15px; }
.breakdown-content>.secondary { justify-self: start; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .88rem; }
td, th { border-top: 1px solid var(--border); padding: 8px; vertical-align: top; }
td:first-child, th:first-child { padding-left: 0; }
th { color: var(--muted); font-size: .81rem; }
.row-link { padding: 0; border: 0; background: transparent; color: var(--aqua); text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.claim { display: grid; gap: 5px; }
.social-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 9px; }
.social-controls .select-label { width: min(100%, 440px); }
.trend { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--ink); }
.trend-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
.trend-head div { display: grid; gap: 3px; }
.trend-head strong { font-size: clamp(1.2rem, 3vw, 2rem); font-variant-numeric: tabular-nums; }
.series-chart { display: block; width: min(100%, 660px); margin: auto; }
.series-chart text { fill: var(--muted); font-size: 9px; }
.series-stroke { stroke: var(--aqua); stroke-width: 2.3; fill: none; stroke-linejoin: round; }
.series-chart circle { fill: var(--cream); stroke: var(--ink); stroke-width: 1; }

dialog { width: min(95vw, 550px); max-height: 90dvh; margin: auto; padding: 0; border: 1px solid var(--border); border-radius: 19px; background: var(--iron); color: var(--paper); box-shadow: 0 15px 55px #0b0f10aa; }
dialog::backdrop { background: #0b1011c9; }
.dialog-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 63px; padding: 10px 17px; background: var(--iron); border-bottom: 1px solid var(--border); }
.dialog-head h2 { font-size: 1.45rem; }
#sources { width: min(100vw, 555px); height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; border-radius: 20px 0 0 20px; border-right: 0; }
.source-body { display: grid; gap: 12px; padding: 13px 17px 24px; }
.source-group { padding: 12px; border: 1px solid var(--border); border-radius: 11px; }
.source-group h3 { display: flex; gap: 7px; align-items: center; color: var(--cream); }
.source-group h3 small { font-weight: 500; color: var(--muted); }
.source-group ul { padding-left: 18px; margin: 8px 0 0; }
.source-group li { margin: 6px 0; overflow-wrap: anywhere; }
.source-group details { margin-top: 9px; border-top: 1px solid var(--border); padding-top: 8px; }
.source-group p { margin-top: 8px; color: var(--muted); line-height: 1.5; }
#filter-form { display: grid; gap: 10px; padding-bottom: 16px; }
#filter-form>.dialog-head { background: color-mix(in srgb, var(--rust) 85%, var(--ink)); color: var(--paper); }
#filter-form>:not(.dialog-head) { margin-inline: 16px; }
.filter-topic { color: var(--cream); font-weight: 800; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { padding: 0; margin-bottom: 5px; }
.select-label { display: grid; gap: 5px; }
select { width: 100%; min-width: 0; min-height: 42px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 9px; background: var(--ink); color: var(--paper); }
.toast { position: fixed; z-index: 5; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: 90%; padding: 8px 12px; border-radius: 10px; background: var(--cream); color: var(--ink); }
.toast:empty, [role=alert]:empty { display: none; }

@media (max-width: 1100px) {
  .account-row { grid-template-columns: 63px minmax(0, 1fr) 17px minmax(0, 1fr) 17px minmax(0, 1fr); gap: 5px; }
  .account-term { gap: 5px; }
  .chart-card, .share-panel { padding: 12px; }
}
@media (max-width: 909px) {
  .explorer-layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .picker-current { display: block; margin-left: auto; }
  .picker>summary::after { margin-left: 3px; }
  .tree-scroll { max-height: min(45dvh, 340px); }
}
@media (max-width: 620px) {
  #site { padding-inline: 13px; }
  .top { min-height: 65px; }
  .brand { gap: 6px; }
  .brand-mark { width: 30px; height: 30px; flex-basis: 30px; padding: 6px; border-radius: 9px; }
  .top-actions { gap: 5px; }
  .top-actions .round { width: 36px; min-height: 36px; flex-basis: 36px; }
  .top-actions .secondary { min-height: 36px; padding: 5px 8px; font-size: .8rem; }
  .top-actions .secondary .icon { display: none; }
  main { gap: 15px; padding-top: 13px; }
  .account-row { grid-template-columns: 43px minmax(0,1fr) 8px minmax(0,1fr) 8px minmax(0,1fr); gap: 3px; padding: 4px 4px 4px 6px; }
  .account-year b { font-size: .96rem; }
  .account-year small { font-size: .68rem; }
  .account-icon { display: none; }
  .account-term { min-height: 43px; padding: 3px 4px; }
  .account-value span { min-height: 1.6em; font-size: .69rem; }
  .account-value b { font-size: clamp(.67rem, 2.9vw, .94rem); }
  .chart-grid { grid-template-columns: minmax(0, 1fr); }
  .budget-chart text { font-size: 18px; }
  .share-year { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .selection-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
}
@media (max-width: 355px) {
  .brand-mark { display: none; }
  .account-row { grid-template-columns: 40px repeat(3,minmax(0,1fr)); }
  .account-sign { display: none; }
  .account-term { padding-inline: 3px; }
  .account-value b { letter-spacing: -.045em; }
}

#generate-report { white-space: nowrap; }
#report-dialog { width: min(96vw, 850px); max-height: 92dvh; }
.report-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; }
#report-preview { padding: 0 16px 16px; }
#report-print { display: none; }
.report-page {
  color-scheme: light;
  color: #202525;
  background: #fff;
  font-family: Arial, sans-serif;
  font-size: .85rem;
  line-height: 1.38;
  padding: 24px clamp(13px, 4vw, 35px);
  overflow-wrap: anywhere;
}
.report-page + .report-page { margin-top: 12px; }
.report-heading { margin-bottom: 15px; }
.report-heading h2 {
  color: #172a34;
  font: bold 1.8em/1.1 Georgia, serif;
  border-bottom: 1px solid #263942;
  margin: 4px 0 6px;
  padding-bottom: 5px;
  letter-spacing: 0;
}
.report-heading p, .report-scope { color: #465455; }
.report-institution { font-size: .85em; font-weight: 750; }
.report-section { margin-bottom: 11px; }
.report-section h3 { color: #263942; font: bold 1.12em/1.2 Georgia, serif; margin-bottom: 4px; }
.report-section p { margin-top: 4px; }
.report-section .report-scope { margin: 0 0 4px; font-size: .86em; }
.report-section table { font-size: .95em; font-variant-numeric: tabular-nums; line-height: 1.24; }
.report-section :is(th,td) { border-color: #dee3e4; padding: 4px 5px; }
.report-section th { font-size: 1em; color: #263942; }
.report-section thead { background: #eef1f1; }
.report-section tbody th { font-weight: 500; }
.report-section :is(th,td):not(:first-child) { text-align: right; }
.report-footer { border-top: 1px solid #a6afb0; padding-top: 5px; font-size: .82em; color: #465455; }
.report-footer p + p { margin-top: 4px; }
.report-page-number { text-align: right; margin-top: 12px; font-size: .85em; color: #465455; }

@media (max-width: 620px) {
  #generate-report { min-height: 36px; padding: 5px 8px; font-size: .8rem; }
  .top { flex-wrap: wrap; gap: 8px; padding-block: 9px; }
  #report-preview { padding: 0 9px 9px; }
  .report-controls { padding-inline: 9px; }
  .report-page { font-size: .78rem; }
  .report-section :is(th,td) { padding-inline: 3px; }
}

@page budget-report { size: A4; margin: 12mm; }
@media print {
  body[data-print-report] { background: #fff; color: #202525; }
  body[data-print-report] > :not(#report-print) { display: none !important; }
  body[data-print-report] #report-print { display: block; page: budget-report; }
  #report-print .report-page { font-size: 10.5pt; padding: 0; }
  #report-print .report-short { font-size: 9.25pt; }
  #report-print .report-page + .report-page { break-before: page; margin: 0; }
  #report-print .report-section, #report-print .report-footer { break-inside: avoid; }
  #report-print .report-section :is(th,td) { padding: 3pt 4pt; }
  #report-print .report-short .report-section :is(th,td) { padding: 2pt 4pt; }
  #report-print .report-page { print-color-adjust: exact; }
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="site">
<header class="top">
 <div class="brand"><span aria-hidden="true" class="brand-mark"><i></i><i></i><i></i></span><h1>Presupuesto Jujuy</h1></div>
 <div class="top-actions"><button class="secondary" type="button" data-sources aria-haspopup="dialog"><span id="source-icon" aria-hidden="true"></span>Fuentes</button>
 <button class="primary" type="button" id="generate-report" aria-haspopup="dialog">Generar informe</button>
 <button class="round share" type="button" id="share" aria-label="Compartir esta vista"></button></div>
</header>
<main id="contenido" tabindex="-1"></main>
</div>
<p class="toast" role="status" id="toast"></p>
<dialog id="filters" aria-labelledby="filter-title"></dialog>
<dialog id="sources" aria-labelledby="sources-title"></dialog>

<script>const years = [2025, 2026, 2027];
const topics = {
  corriente: { name:'Gasto corriente', law:'Gasto corriente', execution:'corriente', overviewOnly:true },
  capital: { name:'Gasto de capital', law:'Gasto de capital', execution:'capital', overviewOnly:true },
  total: { name:'Gasto total', law:'Gasto total', execution:'total', color:'cream', icon:'total' },
  obras: { name:'Obra pública', law:'Trabajos Públicos', execution:'obras', color:'aqua', icon:'works' },
  salud: { name:'Salud', law:'Salud', execution:'3.1', color:'orange', icon:'health' },
  educacion: { name:'Educación y cultura', law:'Cultura y Educación', execution:'3.4', color:'cream', icon:'book' },
  social: { name:'Bienestar social', law:'Bienestar Social', execution:'3.2', color:'aqua', icon:'people', differentScope:true },
  seguridad: { name:'Seguridad', law:'Seguridad', execution:'II', color:'orange', icon:'shield' },
  recursos: { name:'Recursos totales', law:'Recursos totales', overviewOnly:true, basis:'recursos' },
  'ingresos-corrientes': { name:'Recursos corrientes', law:'Recursos corrientes', overviewOnly:true, basis:'recursos' },
  'ingresos-capital': { name:'Recursos de capital', law:'Recursos de capital', overviewOnly:true, basis:'recursos' },
  saldo: { name:'Resultado financiero', law:'Resultado financiero previsto', overviewOnly:true, basis:null },
  amortizacion: { name:'Amortización de deuda', law:'Amortización de deuda', overviewOnly:true, basis:null },
  administracion: { name:'Administración general', law:'Administración General', overviewOnly:true },
  ciencia: { name:'Ciencia y técnica', law:'Ciencia y Técnica', overviewOnly:true },
  economia: { name:'Desarrollo de la economía', law:'Desarrollo de la Economía', overviewOnly:true },
  'deuda-funcion': { name:'Deuda pública', law:'Deuda Pública', overviewOnly:true },
  'sin-clasificar': { name:'Gastos a clasificar', law:'Gastos a Clasificar', overviewOnly:true }
};
const topicCatalog = data => ({
  ...topics, ...Object.fromEntries((data.budgetDetails??[]).map(row=>[row.id,row]))
});
const measures = {
  initial: 'Presupuesto inicial / proyecto',
  accrued: 'Gasto devengado',
  currentCredit: 'Crédito vigente'
};
const parseState = (hash = '', catalog = topics) => {
  const query = new URLSearchParams(hash.replace(/^#/, ''));
  const tab = query.get('vista');
  const requestedTopic = query.get('tema');
  const topic = Object.hasOwn(catalog,requestedTopic) ? requestedTopic : 'total';
  const year = Number(query.get('anio'));
  const measure = query.get('indicador');
  const selected = (query.get('anios') || '').split(',').map(Number).filter(x=>years.includes(x));
  const panel = query.get('ficha');
  const social = query.get('social');
  const baseYear = Number(query.get('base'));
  return {
    tab: ['inicio','tema','comparar','completa','fuentes','indicadores'].includes(tab) ? tab : 'inicio',
    topic,
    year: years.includes(year) ? year : 2026,
    unit: query.get('pesos') === 'constantes' ? 'real' : 'nominal',
    selected: selected.length ? years.filter(x=>selected.includes(x)) : [...years],
    measure: catalog[topic].execution && Object.hasOwn(measures,measure) ? measure : 'initial',
    cut: query.get('corte') === 'anual' ? 'annual' : 'semester',
    social,
    baseYear: years.includes(baseYear) ? baseYear : 2025,
    panel: ['presupuesto','ejecucion','anuncios'].includes(panel) ? panel : 'presupuesto'
  };
};
function stateHash(state) {
  return '#'+new URLSearchParams({
    vista:state.tab, tema:state.topic, anio:state.year,
    pesos:state.unit==='real'?'constantes':'corrientes',
    anios:state.selected.join(','), indicador:state.measure,
    corte:state.cut==='annual'?'anual':'semestre', ficha:state.panel,
    base:state.baseYear,
    ...(state.social ? {social:state.social} : {})
  });
}
const priceYearFactor = (data, year) => data.deflators.find(row=>row.ejercicio===year)?.factor_a_pesos_2025 ?? 1;

const participationBasis = topic => topic.basis === undefined ? 'total' : topic.basis;

function shareOf(data, pesos, year, basis) {
  const denominator = data.annual.find(row=>row.ejercicio===year && row.concepto===topics[basis]?.law)?.pesos_corrientes;
  return denominator > 0 && pesos >= 0 && pesos <= denominator ? pesos/denominator*100 : null;
}

function projectRows(data, state) {
  if(state.year !== 2027) return [];
  return data.projectItems.filter(row=>row.topic===state.topic).map(row=>({
    ...row,
    value:state.unit==='real'?row.pesos*priceYearFactor(data,2027)/priceYearFactor(data,state.baseYear):row.pesos,
    share:row.topic==='obras'?null:shareOf(data,row.pesos,2027,'total'),
    status:'Proyecto · alcance distinto',
    inflation:state.unit==='real'?'Ajuste con IPC proyectado':''
  }));
}

function compareRows(data, state) {
  const topic = topics[state.topic] ?? data.budgetDetails.find(row=>row.id===state.topic);
  const real = state.unit === 'real';
  const baseFactor = real ? priceYearFactor(data,state.baseYear) : 1;
  return state.selected.map(year => {
    if(state.measure==='initial') {
      const index = years.indexOf(year);
      const def = data.deflators.find(item=>item.ejercicio===year);
      const inflation = real && def?.meses_proyectados ? `IPC: ${def.meses_proyectados} meses proyectados` : '';
      if(topic.amounts) {
        const pesos = topic.amounts[index];
        if(!Number.isFinite(pesos)) return {year,status:'Sin dato en este desglose'};
        const [reference,source] = data.budgetSources[topic.source][index];
        return {year,value:real?pesos*priceYearFactor(data,year)/baseFactor:pesos,
          share:shareOf(data,pesos,year,participationBasis(topic)), status:year===2027?'Proyecto':'Ley · crédito inicial',
          scope:reference,inflation,source};
      }
      const row = data.annual.find(row=>row.ejercicio===year && row.concepto===topic.law);
      if(!row){
        const detail = projectRows(data,{...state,year});
        return {year,status:detail.length?'Proyecto · alcance distinto':'Sin dato',detail};
      }
      return {year,value:real?row.pesos_constantes_2025/baseFactor:row.pesos_corrientes,
        share:shareOf(data,row.pesos_corrientes,year,participationBasis(topic)),
        status:row.estado_presupuesto==='proyecto'?'Proyecto':'Ley · crédito inicial',
        scope:row.referencia, inflation, source:row.fuente};
    }
    if(year===2027) return {year,status:'Sin ejecución publicada'};
    if(state.cut==='annual'){
      const row = year===2025 && data.closing.find(row=>row.concepto===topic.execution);
      const total = year===2025 && data.closing.find(row=>row.concepto==='total');
      const field = state.measure==='currentCredit'?'credito_vigente':'devengado';
      if(!row) return {year,status:'Sin dato verificado'};
      return {year,value:row[field]/baseFactor,share:row.cuadro===total?.cuadro&&total[field]>0?row[field]/total[field]*100:null,
        inflation:real&&state.baseYear!==2025?'Base de precios con IPC proyectado':'',status:'Cierre anual',scope:row.cuadro,source:row.fuente};
    }
    if(state.measure==='currentCredit') return {year,status:'Sin dato'};
    const row = data.execution.find(row=>row.codigo===topic.execution);
    if(!row) return {year,status:'Sin dato'};
    const total = data.execution.find(row=>row.codigo==='total');
    const totalValue = total?.[`devengado_${year}`];
    return {year,value:row[real?`devengado_${year}_en_pesos_base_2025`:`devengado_${year}`]/baseFactor,
      share:totalValue>0?row[`devengado_${year}`]/totalValue*100:null,
      status:'Devengado',scope:row.concepto,inflation:real?'Ajuste semestral aproximado':'',
      source:row[`fuente_${year}`]};
  });
}
function variations(rows){
  return rows.map((row,index)=>{
    const prior = rows[index-1];
    const pct = prior?.value > 0 && Number.isFinite(row.value) ? (row.value/prior.value-1)*100 : null;
    return {...row,pct,priorYear:pct===null?null:prior.year};
  });
}
function indicatorRows(data, state, indicator){
  const all = data.indicators.filter(row=>row.indicador===indicator);
  const monetary = all.some(row=>row.unidad==='pesos');
  const adjusted = monetary && state.unit==='real';
  const unit = monetary ? (adjusted?'pesos a precios promedio 2025':'pesos') : all[0]?.unidad;
  const year = String(state.year);
  const series = all.filter(row=>row.unidad===unit && row.periodo.slice(0,4)>= '2025' && row.periodo.slice(0,4)<=year)
    .sort((a,b)=>a.periodo.localeCompare(b.periodo));
  const baseFactor = adjusted ? priceYearFactor(data,state.baseYear) : 1;
  const label = adjusted?`Pesos promedio de ${state.baseYear}`: monetary?'Pesos corrientes':unit;
  const history = series.map(row=>({...row,valor:row.valor/baseFactor}));
  const observations = history.filter(row=>row.periodo.slice(0,4)===year);
  const frequency = period=>period.includes('-S')?'semester':period.includes('-')?'month':'year';
  const chartFrequency = observations.some(row=>frequency(row.periodo)==='month') ? 'month' : frequency(observations.at(-1)?.periodo??'');
  return {monetary,label,rows:observations,chart:observations.length?history.filter(row=>frequency(row.periodo)===chartFrequency):[]};
}

function csvRows(rows,state,catalog=topics) {
  const unit = state.unit==='real'?`pesos promedio de ${state.baseYear}`:'pesos corrientes';
  const cut = state.measure==='initial'||state.cut==='annual'?'anual':'enero a junio';
  const header = ['concepto','indicador','corte','año','unidad','monto','participación porcentual','estado','alcance','ajuste','comparado con','variación porcentual','fuente'];
  const values = rows.flatMap(row=> {
    const common = [measures[state.measure],cut,row.year,unit];
    return row.detail?.length
      ? row.detail.map(item=>[item.label,...common,item.value,item.share,item.status,`${item.reference} · ${item.scope}`,item.inflation,null,null,item.source])
      : [[catalog[state.topic].name,...common,row.value,row.share,row.status,row.scope,row.inflation,row.priorYear,row.pct,row.source]];
  });
  return [header,...values].map(row=>row.map(value=>`"${(typeof value==='number'?String(value).replace('.',','):String(value??'')).replaceAll('"','""')}"`).join(';')).join('\r\n')+'\r\n';
}

function reportTopicRows(data,state,account){
  const rows = compareRows(data,state);

      share:pesos/account.total[index].value*100, status:'Ley · crédito inicial',

function buildReport(data,state,catalog){
  const budgetState = {...state,measure:'initial'};
  const account = Object.fromEntries(reportAggregates.map(topic=>[topic,compareRows(data,{...budgetState,topic,unit:'nominal'})]));
  const real = Object.fromEntries(reportAggregates.map(topic=>[topic,compareRows(data,{...budgetState,topic,unit:'real'})]));
  const cash = state.unit==='real'?real:account;
  const selected = variations(reportTopicRows(data,state,account));
  const educationCapital = state.topic==='jur-40' ? variations(reportTopicRows(data,{...budgetState,topic:'jur-40-capital'},account)) : [];
  const executionYears = state.selected.filter(year=>Object.hasOwn(reportSeptember,year));
  const execution = reportExecutionTopics.map(topic=>{

    const adjusted = nominal.map(row=>({...row,value:row.value*reportIpc2025/reportSeptember[row.year].ipc/priceYearFactor(data,state.baseYear)}));
    return {label:topic==='obras'?'Trabajos Públicos (construcciones)':topics[topic].name,
      rows:state.unit==='real'?adjusted:nominal, realChange:variations(adjusted).at(-1)?.pct??null};
  });
  const sources = new Map();
  const add = (address,label)=>{if(address&&!sources.has(address)) sources.set(address,label);};
  account.total.forEach(row=>add(row.source,row.year===2027?'Proyecto 2027':`Ley ${row.year}`));
  for(const row of [...selected,...educationCapital]){
    add(row.source,`Partida ${row.year}`);

  }
  executionYears.forEach(year=>add(reportSeptember[year].source,`Devengado a septiembre ${year}`));
  add('https://www.indec.gob.ar/ftp/cuadros/economia/serie_ipc_divisiones.csv','IPC NOA (INDEC)');
  return {

      nominal:variations(account[key]),real:variations(real[key])})),
    selected, educationCapital, execution, executionYears, sources:[...sources],

function budgetTrend(rows){
  const values = rows.filter(row=>Number.isFinite(row.value));
  if(!values.length) return '';
  const low = Math.min(0,...values.map(row=>row.value));
  const high = Math.max(0,...values.map(row=>row.value));
  const divisor = high-low || 1;
  const bottom = low===high?164:172;
  const chartX = i=>123+(rows.length===1?.5:i/(rows.length-1))*392;
  const chartY = value=>bottom-(value-low)/divisor*145;
  const ticks = high===low?[0]:[high,(high+low)/2,low];
  const lines = rows.map((row,i)=>{
    const next = rows[i+1];
    if(!Number.isFinite(row.value)||!Number.isFinite(next?.value)) return '';
    return `<line x1="${chartX(i)}" y1="${chartY(row.value)}" x2="${chartX(i+1)}" y2="${chartY(next.value)}" class="budget-line ${next.year===2027?'projected':''}"/>`;
  }).join('');
  return `<svg class="budget-chart" viewBox="0 0 550 206" role="img" aria-label="${safe(values.map(row=>row.year+' · '+millions(row.value)+' millones').join('; '))}">
  ${ticks.map(tick=>`<line x1="121" x2="521" y1="${chartY(tick)}" y2="${chartY(tick)}" class="gridline"/>
  <text x="112" y="${chartY(tick)+4}" text-anchor="end">${num(tick/1e6)}</text>`).join('')}
  ${low<0&&high>0?`<line x1="121" x2="521" y1="${chartY(0)}" y2="${chartY(0)}" class="zero-line"/>`:''}
  ${lines}${rows.map((row,i)=>`<text x="${chartX(i)}" y="197" text-anchor="middle">${row.year}</text>${Number.isFinite(row.value)?
    `<circle cx="${chartX(i)}" cy="${chartY(row.value)}" r="5.5" class="budget-dot ${row.year===2027?'projected':''}"><title>${row.year} · ${millions(row.value)} millones</title></circle>`:''}`).join('')}</svg>`;
}

function periodLabel(period){
  const [year,part] = period.split('-');
  if(!part) return year;
  if(part.startsWith('S')) return `${part.slice(1)}.º semestre ${year}`;
  return new Intl.DateTimeFormat('es-AR',{month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(`${period}-01T00:00:00Z`));
}
function trend(series){
  const rows = series.chart;
  if(!rows.length) return '';
  const first=rows[0],last=rows.at(-1);
  const difference = last.valor-first.valor;
  const change=series.label==='%'?`${pctFormat.format(difference)} p.p.`:first.valor===0?null:`${pctFormat.format(difference/first.valor*100)}%`;
  const low = Math.min(...rows.map(row=>row.valor));
  const high = Math.max(...rows.map(row=>row.valor));
  const padding = (high-low)*.14 || Math.max(Math.abs(high)*.07,1);
  const bottom = Math.max(0,low-padding);
  const top = high+padding;
  const time = period => {
    const [year,cut] = period.split('-');
    const withinYear = cut?.startsWith('S')?Number(cut.slice(1))*6:Number(cut??0);
    return Number(year)*12+withinYear;
  };
  const duration = time(last.periodo)-time(first.periodo) || 1;
  const points = rows.map(row=>[75+284*(time(row.periodo)-time(first.periodo))/duration,154-(row.valor-bottom)/(top-bottom)*127]);
  const ticks=[top,(top+bottom)/2,bottom];
  return `<section class="trend" aria-label="Evolución del indicador">
   <div class="trend-head"><div><small class="muted">Último dato · ${periodLabel(last.periodo)}</small><strong>${num(last.valor)}${series.label==='%'?'%':''}</strong><small class="muted">${safe(series.label)}</small></div>
   ${rows.length>1&&change!==null?`<div><small class="muted">Cambio en el tramo</small><strong>${change}</strong><small class="muted">Desde ${periodLabel(first.periodo)}</small></div>`:''}</div>
   ${rows.length>1?`<svg class="series-chart" viewBox="0 0 380 184" role="img" aria-label="Desde ${periodLabel(first.periodo)} hasta ${periodLabel(last.periodo)}. Cambio de la serie en ${safe(series.label)}.">
   ${ticks.map((tick,i)=>`<line x1="75" x2="359" y1="${27+i*63.5}" y2="${27+i*63.5}" class="gridline"/><text x="69" y="${30+i*63.5}" text-anchor="end">${num(tick)}</text>`).join('')}
   <polyline points="${points.map(p=>p.join(',')).join(' ')}" class="series-stroke"/>
   ${points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.6"><title>${periodLabel(rows[i].periodo)} · ${num(rows[i].valor)}</title></circle>`).join('')}
   <text x="75" y="176">${periodLabel(first.periodo)}</text><text x="359" y="176" text-anchor="end">${periodLabel(last.periodo)}</text></svg>`:''}</section>`;
}

      ${select}</div>${branch?`<ul id="branch-${key}" ${open?'':'hidden'}>${children.join('')}</ul>`:''}</li>`;

  const items=rootTopics.map(key=>node(key)).filter(Boolean);
  return items.length?`<ul class="tree">${items.join('')}</ul>`:'<p class="muted empty-search" role="status">No encontramos partidas con ese nombre.</p>';
}

    <div class="section-heading"><div><h2 id="summary-title">Recursos − gastos = resultado</h2><p class="muted">${moneyUnits(state)}</p></div>${moneyControls(state)}</div>
    ${baseNote(state)}
    <div class="account-list">${years.map((year,i)=>{
      const result=results[i].value;
      const terms=[
        ['recursos','Recursos',resources[i].value,'aqua','bank'],
        ['total','Gastos',spending[i].value,'orange','chart'],
        ['saldo',result>0?'Superávit previsto':result<0?'Déficit previsto':'Resultado equilibrado',result,result<0?'rust':'cream','balance']
      ];
      return `<article class="account-row" aria-label="${year} · ${budgetStatus(year)}">
        <div class="account-year"><b>${year}</b><small>${budgetStatus(year)}</small></div>
        ${terms.map(([key,label,value,tone,glyph],index)=>`${index?`<span class="account-sign" aria-hidden="true">${index===1?'−':'='}</span>`:''}
          <button type="button" class="account-term tone-${tone}" data-aggregate="${key}" aria-label="${label}, ${year}, ${millions(value)} millones. Ver evolución" title="${year} · ${label}">
            <span class="account-icon">${icon(glyph)}</span><span class="account-value"><span>${label}</span><b class="price">${millions(value)}</b></span>
          </button>`).join('')}
      </article>`;
    }).join('')}</div>

}

const changeText = row=>row.pct===null?'—':`${pctFormat.format(row.pct)}% <small class="muted">vs. ${row.priorYear}</small>`;

function breakdown(rows,topic,open){
  const basis=participationBasis(topic);
  const shareHeading=basis==='recursos'?'% de los recursos':state.measure==='currentCredit'?'% del crédito':'% del gasto';
  const children=state.measure==='initial'?(budgetTree[state.topic]??[]).filter(key=>catalog[key]):[];
  let parent=branchParent.get(state.topic);
  while(parent&&!budgetGroups[parent]) parent=branchParent.get(parent);
  return `<details class="panel breakdown" id="breakdown" ${open?'open':''}>
    <summary><span>Desglose y datos</span></summary>
    <div class="breakdown-content">
      ${parent?`<p class="note">${safe(budgetGroups[parent].note)}</p>`:''}
      <div class="table-scroll"><table><thead><tr><th scope="col">Año</th><th scope="col">Monto</th><th scope="col">Variación</th>${basis?`<th scope="col">${shareHeading}</th>`:''}<th scope="col">Estado</th></tr></thead><tbody>
        ${rows.flatMap(row=>{
          if(row.detail?.length) return row.detail.map(item=>`<tr><th scope="row">${row.year}<br><small>${safe(item.label)}</small></th>
            <td class="price">${millions(item.value)}</td><td>—</td>${basis?`<td>${Number.isFinite(item.share)?safe(percent(item.share)):'—'}</td>`:''}
            <td>${safe(item.status)}${item.inflation?`<br><small>${safe(item.inflation)}</small>`:''}</td></tr>`);
          return [`<tr><th scope="row">${row.year}</th><td class="price">${Number.isFinite(row.value)?millions(row.value):'—'}</td><td>${changeText(row)}</td>
            ${basis?`<td>${Number.isFinite(row.share)?safe(percent(row.share)):'—'}</td>`:''}<td>${safe(row.status)}${row.inflation?`<br><small>${safe(row.inflation)}</small>`:''}</td></tr>`];
        }).join('')}</tbody></table></div>
      ${children.length?`<h3>Partidas de este rubro</h3><div class="table-scroll"><table><thead><tr><th scope="col">Partida</th>${state.selected.map(year=>`<th scope="col">${year}</th>`).join('')}</tr></thead><tbody>
      ${children.map(key=>`<tr><th scope="row"><button type="button" class="row-link" data-pick="${key}">${safe(catalog[key].name)}</button></th>
        ${initialRows(key,state.selected).map(row=>`<td class="price">${Number.isFinite(row.value)?millions(row.value):row.detail?.length?'Ver proyecto':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
      <button type="button" class="secondary" data-download>Descargar CSV</button>
    </div>
  </details>`;
}

      <h3><span class="chart-icon tone-orange">${icon('chart')}</span>Evolución del monto</h3>

      <div class="compare-years" style="--year-count:${rows.length}">${rows.map(row=>`<div class="compare-year">
        <span class="year-tag">${row.year}${row.year===2027&&state.measure==='initial'?' · Proyecto':''}</span>
        ${Number.isFinite(row.value)?`<b class="price">${millions(row.value)}</b>${row.pct===null?'':`<small class="change">${changeText(row)}</small>`}`:

      ${state.topic==='recursos'?'<p class="note">En 2026, el artículo 2 y la Planilla 8 distribuyen $740 de forma distinta entre recursos corrientes y de capital. El total coincide.</p>':''}
      ${topic.differentScope&&state.measure!=='initial'?'<p class="note">La ejecución corresponde a Promoción y Asistencia Social, de alcance distinto a la finalidad Bienestar Social.</p>':''}
    </article>
    ${sharePanel(rows,topic)}
  </div>
  ${project.length?`<section class="panel project-card"><h3>2027 · Importes del proyecto</h3><p class="note">Estos importes tienen otro alcance. El gráfico usa la serie comparable.</p>
    <div class="project-values">${project.map(row=>`<div><b>${safe(row.label)}</b><strong class="price">${millions(row.value)}</strong><small class="muted">${safe([row.reference,row.scope,row.inflation].filter(Boolean).join(' · '))}</small></div>`).join('')}</div></section>`:''}

    <div class="breakdown-content">${data.claims.map(claim=>`<article class="claim"><small class="muted">${safe(claim.date)}</small><h3>${safe(claim.title)}</h3><p>${safe(claim.body)}</p></article>`).join('')}</div></details>`:''}`;
}

function methodContent(){
  return `<section class="source-group"><h3>Metodología</h3>
    <details open><summary>Ajuste por inflación</summary><p>Multiplicamos cada monto por el IPC medio del año base dividido por el IPC medio del período. Se usa el IPC NOA y el escenario central para el cálculo anual. El acumulado semestral usa el promedio de ese semestre como aproximación.</p>
    <ul>${data.deflators.map(row=>`<li>${row.ejercicio} · ${row.meses_observados} meses observados · ${row.meses_proyectados} proyectados</li>`).join('')}</ul>
    <p>${sourceLink('https://www.indec.gob.ar/ftp/cuadros/economia/serie_ipc_divisiones.csv','INDEC · series de IPC')} · ${sourceLink('https://www.bcra.gob.ar/archivos/Pdfs/PublicacionesEstadisticas/informes/relevamiento-expectativas-mercado-2026-10.pdf','BCRA · REM de octubre de 2026')}</p></details>
    <details><summary>Participación y resultado</summary><p>Cada partida de gastos se divide por el gasto total del mismo indicador y corte. Los recursos se dividen por los ingresos totales previstos. La participación se conserva en pesos corrientes y constantes.</p><p>El resultado se calcula con ingresos y gastos sin redondear.</p></details>
    <details><summary>Crédito, ejecución y alcance</summary><p>El crédito vigente incorpora modificaciones. El devengado registra una obligación de pago. El 2027 figura como proyecto. Cuando cambia el alcance de un rubro, sus montos aparecen por separado. La descarga deja vacías las celdas sin dato.</p></details>
  </section>`;
}

function sourcesContent(){
  const yearly = years.map((year,i)=>{
    const entries = new Map();
    for(const row of data.annual.filter(item=>item.ejercicio===year)){
      if(!entries.has(row.fuente)) entries.set(row.fuente,row.referencia.startsWith('Art.')
        ? (year===2027?'Proyecto de presupuesto':'Ley de presupuesto'):row.referencia);
    }
    for(const list of Object.values(data.budgetSources)){
      if(list[i]) entries.set(list[i][1],list[i][0]);
    }
    if(year===2027) for(const item of data.projectItems) entries.set(item.source,item.reference);
    for(const row of data.execution){
      const address=row[`fuente_${year}`];
      if(address&&!entries.has(address)) entries.set(address,row.codigo==='total'?'Ejecución I.1 · devengado enero a junio':'Ejecución I.3 · devengado enero a junio');
    }
    for(const row of data.closing.filter(item=>item.ejercicio===year)){
      if(!entries.has(row.fuente)) entries.set(row.fuente,row.cuadro);
    }
    return `<section class="source-group"><h3>${year} <small>${budgetStatus(year)}</small></h3>
      <ul>${[...entries].map(([link,label])=>`<li>${sourceLink(link,label)}</li>`).join('')}</ul></section>`;
  });
  const series = new Map();
  for(const row of data.indicators){
    if(!series.has(row.fuente)) series.set(row.fuente,new Set());
    series.get(row.fuente).add(row.indicador);
  }
  return `<div class="dialog-head"><h2 id="sources-title">Fuentes</h2><button type="button" class="round" data-close aria-label="Cerrar Fuentes">${icon('close')}</button></div>
    <div class="source-body">${yearly.join('')}
    <section class="source-group"><h3>Indicadores sociales</h3><ul>${[...series].map(([link,names])=>
      `<li>${sourceLink(link,[...names].slice(0,2).join(' · '))}${names.size>2?`<small class="muted"> y ${names.size-2} series más</small>`:''}</li>`).join('')}</ul></section>
    <section class="source-group"><h3>Comunicados oficiales</h3><ul>${data.claims.map(claim=>`<li>${sourceLink(claim.url,claim.title)} <small class="muted">${safe(claim.date)}</small></li>`).join('')}</ul></section>
    ${methodContent()}</div>`;
}

function showSources(){
  if(sourceDialog.open) return;
  sourceDialog.innerHTML = sourcesContent();
  sourceDialog.showModal();
}

function dashboard(){
  main.innerHTML=`${summary()}
  <div class="explorer-layout">
    <details id="picker" class="panel picker" ${pickerMedia.matches?'open':''}>
      <summary><span>Partidas</span><span class="picker-current">${safe(catalog[state.topic].name)}</span></summary>
      <div class="picker-body"><label class="search-label">${icon('search')}<input id="partida-search" type="search" placeholder="Buscar una partida" aria-label="Buscar una partida" value="${safe(searchText)}"></label>
      <div id="topic-tree" class="tree-scroll">${topicNodes()}</div></div>

    <section id="analytics" class="analytics" aria-labelledby="current-topic">${analytics(false,state.panel==='anuncios')}</section>

function refreshAnalytics(){
  const chart=document.querySelector('#analytics');
  const active=document.activeElement;
  const open=document.querySelector('#breakdown').open;
  const announcementsOpen=document.querySelector('#announcements')?.open;
  chart.innerHTML=analytics(open,announcementsOpen);
  if(active?.matches('[data-filter]')) chart.querySelector('[data-filter]').focus({preventScroll:true});
}

function writeState(delta,{push=false,section='comparar'}={}){
  state={...state,...delta,tab:section};
  history[push?'pushState':'replaceState'](null,'',stateHash(state));
}

function pickTopic(topic,fromPicker,initial=false){
  const picker=document.querySelector('#picker');
  const fromBreakdown=document.activeElement?.closest('#breakdown');
  writeState({topic,measure:!initial&&catalog[topic].execution?state.measure:'initial',panel:'presupuesto'},{push:true});
  revealTopic(topic);
  if(budgetTree[topic]?.length) expandedBranches.add(topic);
  if(!fromPicker){
    searchText='';
    document.querySelector('#partida-search').value='';
  }
  picker.querySelector('.picker-current').textContent=catalog[topic].name;
  const tree=document.querySelector('#topic-tree');
  tree.innerHTML=topicNodes();
  refreshAnalytics();
  if(fromPicker){
    if(pickerMedia.matches) tree.querySelector(`[data-pick="${topic}"]`)?.focus({preventScroll:true});
    else{
      picker.open=false;
      picker.querySelector('summary').focus({preventScroll:true});
    }
  }
  if(fromBreakdown){
    const heading=document.querySelector('#current-topic');
    heading.tabIndex=-1;
    heading.focus();
  }
}

function updateMoney(delta){
  const active=document.activeElement;
  writeState(delta);
  main.querySelector('.budget-summary').outerHTML=summary();
  refreshAnalytics();
  document.querySelector('#social-content').innerHTML=indicators();
  if(active?.dataset.unit) main.querySelector(`[data-unit="${state.unit}"]`).focus({preventScroll:true});
  if(active?.id==='base-year') main.querySelector('#base-year')?.focus({preventScroll:true});
}

function drawFilters(){
  const options = (entries,active)=>entries.map(([key,label])=>`<option value="${key}" ${key===active?'selected':''}>${label}</option>`).join('');
  dialog.innerHTML=`<form id="filter-form"><div class="dialog-head"><h2 id="filter-title">Años y corte</h2><button class="round" type="button" data-close aria-label="Cerrar filtros">${icon('close')}</button></div>
    <p class="filter-topic">${safe(catalog[draft.topic].name)}</p>
    <fieldset><legend>Años</legend>${yearButtons(draft.selected,'draft-year')}</fieldset>
    <label class="select-label">Qué querés comparar<select data-draft="measure" ${catalog[draft.topic].execution?'':'disabled'}>${options(Object.entries(measures),draft.measure)}</select></label>
    <label class="select-label">Período<select data-draft="cut" ${draft.measure!=='accrued'?'disabled':''}>${options([['semester','Enero a junio'],['annual','Cierre anual']],draft.measure==='accrued'?draft.cut:'annual')}</select></label>
    <p role="alert" id="filter-message"></p><button class="primary" type="submit">Aplicar</button></form>`;
}

function openFilters(){
  draft={...state,selected:[...state.selected]};
  drawFilters();
  dialog.showModal();
}

function restoreView(){
  state = parseState(location.hash,catalog);
  if(!new URLSearchParams(location.hash.slice(1)).has('tema')) state.topic='capital';
  if(state.tab==='tema'&&state.panel==='ejecucion'&&catalog[state.topic].execution) state.measure='accrued';
  if(state.measure==='currentCredit') state.cut='annual';
  revealTopic(state.topic);
  dashboard();
  if(state.tab==='fuentes') showSources();
  if(state.tab==='indicadores') document.querySelector('#social-panel').scrollIntoView();
  if(state.tab==='tema'&&state.panel==='anuncios') document.querySelector('#announcements')?.scrollIntoView();
}

document.querySelector('#source-icon').innerHTML=icon('files');
document.querySelector('#share').innerHTML=icon('share');
document.querySelector('#share').addEventListener('click',share);
document.querySelector('[data-sources]').addEventListener('click',showSources);
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();});
document.addEventListener('input',event=>{
  if(event.target.id!=='partida-search')return;
  searchText=event.target.value;
  document.querySelector('#topic-tree').innerHTML=topicNodes();
});
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button)return;
  const b=button.dataset;
  if(b.pick) pickTopic(b.pick,Boolean(button.closest('#picker')));
  if(b.aggregate) pickTopic(b.aggregate,false,true);
  if(b.branch){
    if(expandedBranches.has(b.branch)) expandedBranches.delete(b.branch);
    else expandedBranches.add(b.branch);
    const tree=document.querySelector('#topic-tree');
    tree.innerHTML=topicNodes();
    tree.querySelector(`[data-branch="${b.branch}"]`)?.focus({preventScroll:true});
  }
  if(b.unit) updateMoney({unit:b.unit});
  if('filter' in b) openFilters();
  if('download' in b) download();
  if('close' in b) button.closest('dialog').close();
  if(b.draftYear){
    const year=Number(b.draftYear);
    draft.selected=years.filter(item=>item===year?!draft.selected.includes(item):draft.selected.includes(item));
    button.setAttribute('aria-pressed',String(draft.selected.includes(year)));
    dialog.querySelector('#filter-message').textContent='';
  }
  if(b.socialYear){
    writeState({year:Number(b.socialYear)},{section:'indicadores'});
    const social=document.querySelector('#social-content');
    social.innerHTML=indicators();
    social.querySelector(`[data-social-year="${state.year}"]`).focus({preventScroll:true});
  }
});
document.addEventListener('change',event=>{
  const target=event.target;
  if(target.id==='base-year') updateMoney({baseYear:Number(target.value)});
  if(target.id==='indicator'){
    writeState({social:target.value},{section:'indicadores'});
    const social=document.querySelector('#social-content');
    social.innerHTML=indicators();
    social.querySelector('#indicator').focus({preventScroll:true});
  }
  if(target.dataset.draft==='cut') draft.cut=target.value;
  if(target.dataset.draft==='measure'){
    draft.measure=target.value;
    draft.cut=draft.measure==='currentCredit'?'annual':'semester';
    drawFilters();
    dialog.querySelector('[data-draft="measure"]').focus();
  }
});
dialog.addEventListener('submit',event=>{
  event.preventDefault();
  if(draft.selected.length<2){
    dialog.querySelector('#filter-message').textContent='Seleccioná al menos dos años.';
    return;
  }
  dialog.close();
  writeState(draft,{push:true});
  refreshAnalytics();
});
for(const modal of [dialog,sourceDialog]) modal.addEventListener('click',event=>{if(event.target===modal)modal.close();});
pickerMedia.addEventListener('change',event=>{document.querySelector('#picker').open=event.matches;});
window.addEventListener('hashchange',restoreView);
restoreView();

const reportDialog = document.querySelector('#report-dialog');
const reportPrint = document.querySelector('#report-print');
const reportNumber = new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const reportChange = new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1,signDisplay:'exceptZero'});
const reportIncomeShare = new Intl.NumberFormat('es-AR',{maximumFractionDigits:3});
const reportAmount = value=>Number.isFinite(value)?reportNumber.format(value/1e6):'—';
const reportPercent = value=>Number.isFinite(value)?safe(percent(value)):'—';
const reportDelta = value=>Number.isFinite(value)?reportChange.format(value)+'%':'—';
let reportFormat = 'short';
let reportState;

function reportTable(headers,rows,label){
  return `<table aria-label="${safe(label)}"><thead><tr>${headers.map(header=>`<th scope="col">${header}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([first,...cells])=>`<tr><th scope="row">${first}</th>${cells.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function reportSection(heading,content,note=''){
  return `<section class="report-section"><h3>${heading}</h3>${content}${note?`<p>${note}</p>`:''}</section>`;
}

function reportHeading(title,subtitle){
  return `<header class="report-heading"><p class="report-institution">PROVINCIA DE JUJUY</p>
    <h2>${title}</h2><p>${subtitle}</p></header>`;
}

function reportFooter(model,view){
  const counts = data.deflators.filter(row=>row.meses_proyectados && (view.selected.includes(row.ejercicio)
    || (view.unit==='real'&&view.baseYear===row.ejercicio)));
  const projected = counts.length?` IPC con meses proyectados (${counts.map(row=>`${row.ejercicio}, ${row.meses_proyectados}`).join(' · ')}).`:'';
  const september = model.executionYears.length?' Para el devengado a septiembre se usa el IPC medio de enero a septiembre.':'';
  const semester = view.measure==='accrued'&&view.cut==='semester'&&view.unit==='real'
    ? ' La partida devengada a junio usa el IPC medio del semestre.':'';
  return `<footer class="report-footer"><p>Las variaciones reales usan el IPC NOA. Las participaciones se calculan sobre el total del mismo año e indicador.${projected}${september}${semester}</p>
    <p>Fuentes. ${model.sources.map(([address,label])=>sourceLink(address,label)).join(' · ')}</p></footer>`;
}

function reportSummarySections(model,view) {
  const {cash,trend,balanceShare} = model;
  const {selected} = view;
  const end = selected.at(-1);
  const balanceNote = `El ${cash.saldo.at(-1).value<0?'déficit':'superávit'} previsto para ${end} equivale a ${reportIncomeShare.format(Math.abs(balanceShare.at(-1)))}% de los recursos.`;
  const accounts = reportTable(['Año','Recursos','Gastos','Resultado previsto'],selected.map((year,i)=>[
    `${year} · ${budgetStatus(year)}`,...['recursos','total','saldo'].map(key=>reportAmount(cash[key][i].value))
  ]),'Recursos, gastos y resultado');
  const compared = selected.slice(1);
  const changes = reportTable(['Concepto',...compared.flatMap((year,i)=>[
    `${year}/${String(selected[i]).slice(-2)}<br>Nominal`,`${year}/${String(selected[i]).slice(-2)}<br>Real`
  ])],trend.map(row=>[row.label,...compared.flatMap((year,i)=>[reportDelta(row.nominal[i+1].pct),reportDelta(row.real[i+1].pct)])]),'Variaciones del gasto');
  const realNote = compared.length?`Entre ${selected.at(-2)} y ${end}, la variación real ${end===2025?'':'estimada '}es de ${reportDelta(trend[0].real.at(-1).pct)} en el gasto total, ${reportDelta(trend[1].real.at(-1).pct)} en el corriente y ${reportDelta(trend[2].real.at(-1).pct)} en capital.`:'';
  const mix = reportTable(['Componente',...selected.map(year=>`% ${year}`),`Monto ${end}`],
    ['corriente','capital'].map(key=>[topics[key].name,...cash[key].map(row=>reportPercent(row.share)),reportAmount(cash[key].at(-1).value)]),'Composición del gasto');
  return reportSection('Recursos, gastos y resultado',accounts,balanceNote)
    +reportSection('Evolución del gasto · Análisis horizontal',changes,realNote)
    +reportSection('Composición del gasto · Análisis vertical',mix,
      'El gasto corriente incluye personal, funcionamiento y transferencias. El gasto de capital incluye construcciones y equipamiento.');
}

function reportTopicSection(model,view) {
  const topic = catalog[view.topic];
  const {selected,educationCapital,shareBasis} = model;
  const shareHeading = shareBasis==='recursos'?'% de recursos':view.measure==='currentCredit'?'% del crédito':'% del gasto';
  const columns = ['Año','Monto',...(shareBasis?[shareHeading]:[]),'Variación',...(educationCapital.length?['Capital']:[])];
  const rows = selected.map((row,i)=>[
    `${row.year} · ${safe(view.measure==='initial'?budgetStatus(row.year):row.status)}`,
    reportAmount(row.value),...(shareBasis?[reportPercent(row.share)]:[]),reportDelta(row.pct),
    ...(educationCapital.length?[reportAmount(educationCapital[i].value)]:[])
  ]);
  const projectDetail = selected.flatMap(row=>row.detail??[]);
  const unavailable = selected.filter(row=>!Number.isFinite(row.value)&&!row.detail?.length).map(row=>row.year);
  const notes = [
    projectDetail.length?`<strong>2027 · Proyecto con otro alcance.</strong> ${projectDetail.map(item=>`${safe(item.label)} (${reportAmount(item.value)})`).join(' · ')}.`:'',
    unavailable.length?`Sin dato comparable para ${unavailable.join(' y ')}.`:'',
    topic.note?safe(topic.note):'',
    topic.differentScope&&view.measure!=='initial'?'La ejecución corresponde a Promoción y Asistencia Social, de alcance distinto a Bienestar Social.':'',
    educationCapital.length&&educationCapital.at(-1).pct!==null
      ?`El gasto de capital del Ministerio varía ${reportDelta(educationCapital.at(-1).pct)} entre ${educationCapital.at(-1).priorYear} y ${educationCapital.at(-1).year}, en los valores elegidos.`:''
  ].filter(Boolean).join(' ');
  return reportSection(`Partida seleccionada · ${safe(topic.name)}`,
    `<p class="report-scope">${safe(rangeText(view))}</p>${reportTable(columns,rows,topic.name)}`,notes);
}

function reportExecutionSection(model,view) {
  const {execution,executionYears} = model;
  const caption = 'Ejecución provincial · Enero a septiembre';
  if(!executionYears.length) return reportSection(caption,'<p>Sin ejecución publicada para el año seleccionado.</p>');
  const compared = executionYears.length>1;
  const rows = execution.map(row=>[row.label,...row.rows.map(item=>reportAmount(item.value)),...(compared?[reportDelta(row.realChange)]:[])]);
  const note = [
    compared?`En el mismo corte, la variación real del devengado de Trabajos Públicos fue de ${reportDelta(execution.at(-1).realChange)}.`:'',
    view.selected.includes(2027)?'2027 figura como proyecto.':''
  ].filter(Boolean).join(' ');
  return reportSection(caption,reportTable(['Concepto',...executionYears.map(year=>`Devengado ${year}`),...(compared?['Variación real']:[])],rows,caption),note);
}

function reportMarkup(view,layout) {
  const model = buildReport(data,view,catalog);
  const units = safe(moneyUnits(view));
  const span = view.selected.join(' · ');
  const title = `Informe presupuestario`;
  const label = `${span} · ${units}`;
  const summary = reportSummarySections(model,view);
  const detail = reportTopicSection(model,view)+reportExecutionSection(model,view);
  const footer = reportFooter(model,view);
  if(layout==='short') return `<article class="report-page report-short">${reportHeading(title,label)}${summary}${detail}${footer}</article>`;
  return `<article class="report-page">${reportHeading(title,label)}${summary}<p class="report-page-number">1 / 2</p></article>
    <article class="report-page">${reportHeading('Partida y ejecución',label)}${detail}${footer}<p class="report-page-number">2 / 2</p></article>`;
}

function drawReportPreview() {
  for(const button of reportDialog.querySelectorAll('[data-report-format]')) {
    button.setAttribute('aria-pressed',String(button.dataset.reportFormat===reportFormat));
  }
  reportDialog.querySelector('#report-preview').innerHTML = reportMarkup(reportState,reportFormat);
}

function showReport() {
  if(reportDialog.open) return;
  reportState = {...state,selected:[...state.selected]};
  reportDialog.innerHTML = `<div class="dialog-head"><h2 id="report-dialog-title">Generar informe</h2>
    <button class="round" type="button" data-close aria-label="Cerrar informe">${icon('close')}</button></div>
    <div class="report-controls"><div class="units" role="group" aria-label="Formato del informe">
      <button class="pill" type="button" data-report-format="short">Breve · 1 hoja</button>
      <button class="pill" type="button" data-report-format="long">Ampliado · 2 hojas</button>
    </div><button class="primary" type="button" data-print-report>Imprimir o guardar PDF</button></div>
    <div id="report-preview"></div>`;
  drawReportPreview();
  reportDialog.showModal();
}

function clearPrintReport() {
  delete document.body.dataset.printReport;
  reportPrint.replaceChildren();
}

document.querySelector('#generate-report').addEventListener('click',showReport);
reportDialog.addEventListener('click',event=>{
  if(event.target===reportDialog){reportDialog.close();return;}
  const button = event.target.closest('button');
  if(!button) return;
  if(button.dataset.reportFormat){
    reportFormat = button.dataset.reportFormat;
    drawReportPreview();
  }
  if('printReport' in button.dataset){
    reportPrint.innerHTML = reportMarkup(reportState,reportFormat);
    document.body.dataset.printReport = '';
    window.print();
  }
});
reportDialog.addEventListener('close',clearPrintReport);
window.addEventListener('afterprint',clearPrintReport);
</script>
</body>
</html>
