<!doctype html>

<head>

<title>Presupuesto Jujuy</title>
<style>:root{color-scheme:dark;--iron:#222a2a;--ink:#192121;--aqua:#4fbbbc;--rust:#ec4624;--orange:#f39120;--cream:#e2dac2;--paper:#f6efe1;--muted:#c3c6b9;--border:#52605b;--field:#323e3b;font-family:Inter,"Trebuchet MS",Arial,sans-serif;font-synthesis:none;color:var(--paper);background:var(--ink)}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.54}
a{color:inherit;text-underline-offset:.22em}
button,a,select,input{touch-action:manipulation}
:focus-visible{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 7px #1a2422}
.skip{position:fixed;top:4px;left:8px;transform:translateY(-150%);background:var(--cream);color:var(--ink);padding:10px;z-index:4}
.skip:focus{transform:none}
#site{max-width:1120px;margin:auto;padding:0 clamp(18px,4vw,46px) 110px}
.top{height:87px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand,.round,.pill,.primary,.secondary,.nav-item,.topic,.layer,.year,.back,.text-button{border:0;font-weight:800}
.brand{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:var(--ink);padding:9px 15px 9px 9px;border-radius:999px;font-size:.96rem;min-height:45px}
.brand-mark{border-radius:50%;width:28px;height:28px;background:var(--ink);color:var(--orange);display:inline-flex;gap:2px;align-items:flex-end;justify-content:center;padding:7px}
.brand-mark i{background:currentColor;height:6px;width:3px;border-radius:1px}.brand-mark i:nth-child(2){height:10px}.brand-mark i:nth-child(3){height:14px}
.round{display:grid;place-items:center;border-radius:50%;width:46px;height:46px;background:var(--cream);color:var(--ink)}
.icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{padding-top:33px;min-height:60vh}
main:focus, h1:focus{outline:none;box-shadow:none}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.6rem,7vw,5.35rem);letter-spacing:-.072em;line-height:.98;font-weight:900;max-width:15ch}
h2{font-size:clamp(1.5rem,3.3vw,2.05rem);letter-spacing:-.04em;line-height:1.12}
h3{font-size:1.12rem}
.sub,.muted{color:var(--muted);line-height:1.48}
.sub{margin-top:11px;font-size:1rem}
small{font-size:.83rem}
.layout{display:grid;grid-template-columns:1fr .85fr;gap:25px;margin-top:23px}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.controls{display:grid;gap:9px;align-content:start}
.years,.units{display:flex;gap:5px;background:var(--field);padding:4px;border-radius:999px;width:fit-content}
.year,.pill{min-height:40px;border-radius:999px;color:var(--paper);background:transparent;padding:7px 15px;white-space:nowrap}
.year[aria-pressed=true]{background:var(--orange);color:var(--ink)}
.pill[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.lead{background:var(--iron);border:1px solid var(--border);border-radius:24px;padding:clamp(18px,3vw,28px);display:grid;align-content:start;gap:6px}
.lead strong{font-size:clamp(2.2rem,5vw,4rem);letter-spacing:-.07em;line-height:1;display:block;margin:9px 0 2px}
.price{font-variant-numeric:tabular-nums;white-space:nowrap}
.primary,.secondary{border-radius:999px;padding:10px 17px;min-height:45px;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}
.primary{background:var(--orange);color:var(--ink)}
.secondary{background:transparent;color:var(--paper);border:1px solid var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;align-items:center}
.section-title{margin-bottom:10px}
.topic-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.topic,.layer{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--ink);min-width:0}
.topic{min-height:84px;border-radius:19px;padding:13px}
.topic:first-child{grid-column:1/-1;min-height:95px}
.topic strong{font-size:clamp(1.15rem,2.5vw,1.68rem);letter-spacing:-.04em;line-height:1;display:block}
.topic .glyph,.layer .glyph{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--cream);flex-shrink:0}
.aqua{background:var(--aqua)}.orange{background:var(--orange)}.cream{background:var(--cream)}.rust{background:var(--rust)}
.topic:hover,.layer:hover,.primary:hover,.brand:hover{filter:brightness(1.075)}
#nav{position:fixed;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);width:min(94%,490px);left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));background:#222b2a;border:1px solid #6e7770;padding:5px;border-radius:28px;box-shadow:0 6px 32px #05090983}
.nav-item{display:grid;place-items:center;gap:4px;min-height:53px;padding:5px 7px;background:transparent;color:var(--paper);border-radius:22px;font-size:.85rem}
.nav-item[aria-current=page]{background:var(--orange);color:var(--ink)}
.back,.text-button{display:inline-flex;gap:6px;align-items:center;color:var(--paper);background:transparent;padding:0;min-height:43px;text-decoration:underline;text-underline-offset:4px}
.back{margin-bottom:8px}
.layers{display:grid;gap:0;margin-top:0}
.layer{border-radius:22px 22px 0 0;padding:15px 18px 24px;min-height:80px;font-size:1.45rem}
.layer:last-child{border-radius:22px;padding-bottom:15px}
.layer+.layer{margin-top:-9px}
.layer[aria-pressed=true]{outline:2px solid var(--paper);outline-offset:-5px}
.detail{display:grid;align-content:start;gap:10px}
.measure-grid{display:grid;gap:7px}
.data-row{padding:12px 0;border-top:1px solid var(--border);display:grid;gap:5px}
.data-row strong{font-size:1.35rem}
.data-row a{font-size:.88rem}
.chip{border:1px solid var(--border);border-radius:20px;padding:5px 8px;color:var(--muted);font-size:.84rem}
.compare-head{display:grid;gap:12px}
.results{margin-top:18px;display:grid;gap:13px}
.results h2{font-size:1.5rem}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.92rem}
td,th{padding:10px 8px;border-top:1px solid var(--border);vertical-align:top}
td:first-child,th:first-child{padding-left:0}
th{color:var(--muted);font-size:.82rem}
details>summary{cursor:pointer;font-weight:800;padding:6px 0}
.note{border-left:3px solid var(--orange);padding:3px 0 3px 11px;line-height:1.45;color:var(--muted);font-size:.88rem}
.source-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:9px}
.source-list li{padding:13px;border:1px solid var(--border);border-radius:13px}
.source-list a{font-weight:800}
.source-list small{display:block;margin-top:5px;color:var(--muted)}
#filters{background:var(--rust);color:#141918;width:min(100%,550px);max-height:94dvh;border:0;border-radius:29px;padding:22px;margin:auto;box-shadow:0 10px 45px #16100c63}
#filters::backdrop{background:#080b0bcc}
#filters form{display:grid;gap:12px}
#filters header{display:flex;align-items:center;justify-content:space-between;gap:9px}
#filters header .round{color:var(--paper);background:var(--ink)}
#filters h2{font-size:2.15rem}
#filters label,#filters legend{font-weight:800}
#filters .hint{font-size:.88rem;font-weight:650}
#filters .units,#filters .years{background:#652811}
#filters .primary{color:var(--cream);background:var(--ink);width:100%}
#filters .year[aria-pressed=true]{background:var(--cream)}
#filters [role=alert]{font-weight:800}
fieldset{padding:0;margin:0;border:0;display:grid;gap:4px}
select{min-height:44px;border:1px solid var(--border);border-radius:11px;padding:8px 11px;background:var(--ink);color:var(--paper);width:100%}
.filters-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters-grid label,.select-label{display:grid;gap:4px}
.toast{position:fixed;z-index:5;bottom:84px;left:50%;transform:translateX(-50%);max-width:90%;padding:9px 15px;background:var(--cream);color:var(--ink);border-radius:12px;box-shadow:0 4px 15px #0008}
.toast:empty{display:none}
.method{margin-top:12px}
@media(max-width:720px){.top{height:69px}.layout,.hero{grid-template-columns:1fr;gap:15px}.layout{margin-top:16px}main{padding-top:24px}.lead{border-radius:19px}.home-data{order:2}.topic-list{grid-template-columns:1fr}.topic:first-child{grid-column:auto}.topic,.topic:first-child{min-height:75px}.topic .glyph{width:38px;height:38px}.responsive-hide{display:none}#filters{margin:auto 0 0;width:100%;max-width:none;border-radius:26px 26px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:no-preference){button{transition:filter .15s,background-color .15s}}

.top-actions,.money-controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.top-actions{gap:18px}
.base-picker{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.base-picker select{width:auto;min-height:38px}
#filters .base-picker{padding-top:5px}
.year-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.year-card{display:grid;align-content:start;gap:8px;border:1px solid var(--border);padding:12px;border-radius:13px;min-width:0}
.year-tag{color:var(--cream);font-weight:800;font-size:.86rem}
.change{font-weight:750;color:var(--aqua)}
.trend{background:var(--ink);border:1px solid var(--border);border-radius:15px;padding:12px;margin:8px 0}
.trend-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.trend-head div{display:grid;gap:3px}
.trend-head strong{font-size:clamp(1.2rem,3.2vw,2rem);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.series-chart{display:block;width:min(100%,690px);margin:auto}
.series-chart text{fill:var(--muted);font-size:9px}
.series-chart .gridline{stroke:var(--border);stroke-width:.6}
.series-stroke{stroke:var(--aqua);stroke-width:2.3;fill:none;stroke-linejoin:round}
.series-chart circle{fill:var(--cream);stroke:var(--ink);stroke-width:1}

.change{display:block;font-weight:750;color:var(--aqua)}
.project-comparison{margin-top:12px}
.compare-head h1{font-size:clamp(2.15rem,5.5vw,4.3rem);max-width:23ch;overflow-wrap:anywhere}
.compare-layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(270px,1fr);grid-template-rows:auto 1fr;grid-template-areas:"chart controls" "chart participation";align-items:start;gap:12px}
.compare-chart{grid-area:chart;min-width:0;align-self:stretch}
.compare-controls{grid-area:controls;gap:12px;padding:18px}
.compare-controls select{min-width:0}
.compare-controls .secondary{justify-self:start}
.compare-controls .money-controls{gap:6px}
.compare-controls .pill{padding-inline:11px}
.budget-chart{display:block;width:100%;max-height:350px;margin:8px 0}
.budget-chart text{fill:var(--muted);font-size:12px}
.budget-chart .gridline{stroke:var(--border);stroke-width:.65}
.budget-chart .zero-line{stroke:var(--muted);stroke-width:1.4}
.budget-line{stroke:var(--aqua);stroke-width:2.5}
.budget-line.projected{stroke-dasharray:5 5}
.budget-dot{fill:var(--aqua);stroke:var(--ink);stroke-width:1.5}
.budget-dot.projected{fill:var(--iron);stroke:var(--aqua);stroke-width:2.5}
.compare-years{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:6px 0 10px}
.compare-year{padding:10px 11px;border:1px solid var(--border);border-radius:12px;min-width:0}
.compare-year .price{font-size:clamp(.98rem,2vw,1.28rem);letter-spacing:-.03em;white-space:normal;overflow-wrap:anywhere;margin:5px 0;line-height:1.2}
.compare-year small{display:block}
.share-panel{grid-area:participation;gap:8px;padding:18px}
.share-panel>p{font-size:.88rem}
.share-year{display:grid;gap:7px;border-top:1px solid var(--border);padding:10px 0 2px}
.share-year h3{font-size:1rem}
.share-year h3 span{font-size:.8rem;font-weight:500}
.share-year>p{font-size:.89rem}
.share-item{display:grid;grid-template-columns:66px minmax(0,1fr);gap:9px;align-items:center;font-size:.89rem;line-height:1.35}
.budget-pie{position:relative;display:grid;place-items:center;width:66px;min-height:66px}
.budget-pie svg{position:absolute;width:100%;height:100%;fill:none;stroke-width:10}
.pie-rest{stroke:#495653}
.pie-part{stroke:var(--aqua)}
.budget-pie span{position:relative;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums}
.balance-card dl,.balance-card dd{margin:0}
.balance-card dl{display:grid;gap:9px}
.balance-card dl>div{display:grid;gap:3px}
.balance-card dt{color:var(--muted);font-size:.85rem}
.balance-card dd{font-size:clamp(.95rem,2.3vw,1.32rem);font-weight:800;letter-spacing:-.025em;white-space:normal;overflow-wrap:anywhere}
.balance-card .balance-line{border-top:1px solid var(--border);padding-top:8px}
.balance-card .balance-line dd{color:var(--aqua)}
.budget-structure{--budget-columns:minmax(0,1.65fr) repeat(3,minmax(0,1fr));gap:8px}
.budget-column-head,.budget-summary{display:grid;grid-template-columns:var(--budget-columns);gap:10px;align-items:start}
.budget-column-head{font-size:.86rem;color:var(--muted);padding:8px 10px 0}
.budget-column-head span:not(:first-child){text-align:right}
.budget-node{min-width:0;border-top:1px solid var(--border)}
.budget-structure>details{background:var(--ink);border:1px solid var(--border);border-radius:12px}
.budget-node>summary{list-style:none;padding:10px;margin:0;font-size:.92rem;min-height:44px}
.budget-node>summary::-webkit-details-marker{display:none}
.budget-node>summary:hover{background:#6f8d8215;border-radius:10px}
.budget-label{display:flex;align-items:baseline;gap:9px;overflow-wrap:anywhere}
.budget-group .budget-label{grid-column:1/-1}
.disclosure{display:inline-block;flex:0 0 7px;width:7px;height:7px;border-right:2px solid var(--aqua);border-bottom:2px solid var(--aqua);transform:rotate(-45deg);align-self:center}
.budget-node[open]>summary .disclosure{transform:rotate(45deg)}
.budget-cell{min-width:0;text-align:right}
.budget-cell .price{white-space:normal;overflow-wrap:anywhere}
.budget-cell small{display:block;font-weight:500}
.budget-cell-year{display:none}
.budget-children{padding-inline:clamp(6px,1.3vw,13px) 4px}
.budget-children>p,.project-detail{margin:6px 8px 10px}
.project-detail .price{white-space:normal}
.budget-row-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 7px;color:var(--muted);font-size:.84rem}
.budget-row-actions .text-button{color:var(--aqua)}
@media(max-width:810px){
 .compare-layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"controls" "chart" "participation"}
}
@media(max-width:650px){
 .budget-chart text{font-size:19px}
 .budget-structure{--budget-columns:repeat(3,minmax(0,1fr));padding-inline:12px}
 .budget-structure>h2,.budget-structure>p,.budget-structure>small{margin-inline:4px}
 .budget-column-head{display:none}
 .budget-node>summary{gap:6px;padding:8px 6px}
 .budget-label{grid-column:1/-1}
 .budget-cell{font-size:clamp(.72rem,2.65vw,.9rem);text-align:left}
 .budget-cell-year{display:block;color:var(--muted);font-size:.75rem;font-weight:500}
 .budget-children{padding-inline:5px 1px}
 .budget-cell small{font-size:.73rem}
}
@media(max-width:420px){
 .top-actions{gap:10px}
 .top-actions .round{width:38px;height:38px}
 .year-overview{gap:4px}
 .year-card{padding:8px 5px}
 .year-tag,.year-card small,.balance-card dt{font-size:.72rem}
 .balance-card dd{font-size:.85rem}
 .compare-years{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
 .compare-year{padding:8px 5px}
 .compare-year .price{font-size:.85rem}
 .compare-year small{font-size:.72rem}
}
</style>
</head>

<script>const years = [2025, 2026, 2027];
const topics = {
  corriente: { name:'Gasto corriente', law:'Gasto corriente', execution:'corriente', overviewOnly:true },
  capital: { name:'Gasto de capital', law:'Gasto de capital', execution:'capital', overviewOnly:true },
  total: { name:'Gasto total', law:'Gasto total', execution:'total', color:'cream', icon:'total' },
  obras: { name:'Obra pública', law:'Trabajos Públicos', execution:'obras', color:'aqua', icon:'works' },
  salud: { name:'Salud', law:'Salud', execution:'3.1', color:'orange', icon:'health' },
  educacion: { name:'Educación y cultura', law:'Cultura y Educación', execution:'3.4', color:'cream', icon:'book' },
  social: { name:'Bienestar social', law:'Bienestar Social', execution:'3.2', color:'aqua', icon:'people', differentScope:true },
  seguridad: { name:'Seguridad', law:'Seguridad', execution:'II', color:'orange', icon:'shield' },
  recursos: { name:'Recursos totales', law:'Recursos totales', overviewOnly:true, basis:'recursos' },
  'ingresos-corrientes': { name:'Recursos corrientes', law:'Recursos corrientes', overviewOnly:true, basis:'recursos' },
  'ingresos-capital': { name:'Recursos de capital', law:'Recursos de capital', overviewOnly:true, basis:'recursos' },
  saldo: { name:'Resultado financiero', law:'Resultado financiero previsto', overviewOnly:true, basis:null },
  amortizacion: { name:'Amortización de deuda', law:'Amortización de deuda', overviewOnly:true, basis:null },
  administracion: { name:'Administración general', law:'Administración General', overviewOnly:true },
  ciencia: { name:'Ciencia y técnica', law:'Ciencia y Técnica', overviewOnly:true },
  economia: { name:'Desarrollo de la economía', law:'Desarrollo de la Economía', overviewOnly:true },
  'deuda-funcion': { name:'Deuda pública', law:'Deuda Pública', overviewOnly:true },
  'sin-clasificar': { name:'Gastos a clasificar', law:'Gastos a Clasificar', overviewOnly:true }
};
const topicCatalog = data => ({
  ...topics, ...Object.fromEntries((data.budgetDetails??[]).map(row=>[row.id,row]))
});
const measures = {
  initial: 'Presupuesto inicial / proyecto',
  accrued: 'Gasto devengado',
  currentCredit: 'Crédito vigente'
};
const parseState = (hash = '', catalog = topics) => {
  const query = new URLSearchParams(hash.replace(/^#/, ''));
  const tab = query.get('vista');
  const requestedTopic = query.get('tema');
  const topic = Object.hasOwn(catalog,requestedTopic) ? requestedTopic : 'total';
  const year = Number(query.get('anio'));
  const measure = query.get('indicador');
  const selected = (query.get('anios') || '').split(',').map(Number).filter(x=>years.includes(x));
  const panel = query.get('ficha');
  const social = query.get('social');
  const baseYear = Number(query.get('base'));
  return {
    tab: ['inicio','tema','comparar','completa','fuentes','indicadores'].includes(tab) ? tab : 'inicio',
    topic,
    year: years.includes(year) ? year : 2026,
    unit: query.get('pesos') === 'constantes' ? 'real' : 'nominal',
    selected: selected.length ? years.filter(x=>selected.includes(x)) : [...years],
    measure: catalog[topic].execution && Object.hasOwn(measures,measure) ? measure : 'initial',
    cut: query.get('corte') === 'anual' ? 'annual' : 'semester',
    social,
    baseYear: years.includes(baseYear) ? baseYear : 2025,
    panel: ['presupuesto','ejecucion','anuncios'].includes(panel) ? panel : 'presupuesto'
  };
};
function stateHash(state) {
  return '#'+new URLSearchParams({
    vista:state.tab, tema:state.topic, anio:state.year,
    pesos:state.unit==='real'?'constantes':'corrientes',
    anios:state.selected.join(','), indicador:state.measure,
    corte:state.cut==='annual'?'anual':'semestre', ficha:state.panel,
    base:state.baseYear,
    ...(state.social ? {social:state.social} : {})
  });
}
const priceYearFactor = (data, year) => data.deflators.find(row=>row.ejercicio===year)?.factor_a_pesos_2025 ?? 1;

const participationBasis = topic => topic.basis === undefined ? 'total' : topic.basis;

function shareOf(data, pesos, year, basis) {
  const denominator = data.annual.find(row=>row.ejercicio===year && row.concepto===topics[basis]?.law)?.pesos_corrientes;
  return denominator > 0 && pesos >= 0 && pesos <= denominator ? pesos/denominator*100 : null;
}

function projectRows(data, state) {
  if(state.year !== 2027) return [];
  return data.projectItems.filter(row=>row.topic===state.topic).map(row=>({
    ...row,
    value:state.unit==='real'?row.pesos*priceYearFactor(data,2027)/priceYearFactor(data,state.baseYear):row.pesos,
    share:row.topic==='obras'?null:shareOf(data,row.pesos,2027,'total'),
    status:'Proyecto · alcance distinto',
    inflation:state.unit==='real'?'Ajuste con IPC proyectado':''
  }));
}

function compareRows(data, state) {
  const topic = topics[state.topic] ?? data.budgetDetails.find(row=>row.id===state.topic);
  const real = state.unit === 'real';
  const baseFactor = real ? priceYearFactor(data,state.baseYear) : 1;
  return state.selected.map(year => {
    if(state.measure==='initial') {
      const index = years.indexOf(year);
      const def = data.deflators.find(item=>item.ejercicio===year);
      const inflation = real && def?.meses_proyectados ? `IPC: ${def.meses_proyectados} meses proyectados` : '';
      if(topic.amounts) {
        const pesos = topic.amounts[index];
        if(!Number.isFinite(pesos)) return {year,status:'Sin dato en este desglose'};
        const [reference,source] = data.budgetSources[topic.source][index];
        return {year,value:real?pesos*priceYearFactor(data,year)/baseFactor:pesos,
          share:shareOf(data,pesos,year,participationBasis(topic)), status:year===2027?'Proyecto':'Ley · crédito inicial',
          scope:reference,inflation,source};
      }
      const row = data.annual.find(row=>row.ejercicio===year && row.concepto===topic.law);
      if(!row){
        const detail = projectRows(data,{...state,year});
        return {year,status:detail.length?'Proyecto · alcance distinto':'Sin dato',detail};
      }
      return {year,value:real?row.pesos_constantes_2025/baseFactor:row.pesos_corrientes,
        share:shareOf(data,row.pesos_corrientes,year,participationBasis(topic)),
        status:row.estado_presupuesto==='proyecto'?'Proyecto':'Ley · crédito inicial',
        scope:row.referencia, inflation, source:row.fuente};
    }
    if(year===2027) return {year,status:'Sin ejecución publicada'};
    if(state.cut==='annual'){
      const row = year===2025 && data.closing.find(row=>row.concepto===topic.execution);
      const total = year===2025 && data.closing.find(row=>row.concepto==='total');
      const field = state.measure==='currentCredit'?'credito_vigente':'devengado';
      if(!row) return {year,status:'Sin dato verificado'};
      return {year,value:row[field]/baseFactor,share:row.cuadro===total?.cuadro&&total[field]>0?row[field]/total[field]*100:null,
        inflation:real&&state.baseYear!==2025?'Base de precios con IPC proyectado':'',status:'Cierre anual',scope:row.cuadro,source:row.fuente};
    }
    if(state.measure==='currentCredit') return {year,status:'Sin dato'};
    const row = data.execution.find(row=>row.codigo===topic.execution);
    if(!row) return {year,status:'Sin dato'};
    const total = data.execution.find(row=>row.codigo==='total');
    const totalValue = total?.[`devengado_${year}`];
    return {year,value:row[real?`devengado_${year}_en_pesos_base_2025`:`devengado_${year}`]/baseFactor,
      share:totalValue>0?row[`devengado_${year}`]/totalValue*100:null,
      status:'Devengado',scope:row.concepto,inflation:real?'Ajuste semestral aproximado':'',
      source:row[`fuente_${year}`]};
  });
}
function variations(rows){
  return rows.map((row,index)=>{
    const prior = rows[index-1];
    const pct = prior?.value > 0 && Number.isFinite(row.value) ? (row.value/prior.value-1)*100 : null;
    return {...row,pct,priorYear:pct===null?null:prior.year};
  });
}
function indicatorRows(data, state, indicator){
  const all = data.indicators.filter(row=>row.indicador===indicator);
  const monetary = all.some(row=>row.unidad==='pesos');
  const adjusted = monetary && state.unit==='real';
  const unit = monetary ? (adjusted?'pesos a precios promedio 2025':'pesos') : all[0]?.unidad;
  const year = String(state.year);
  const series = all.filter(row=>row.unidad===unit && row.periodo.slice(0,4)>= '2025' && row.periodo.slice(0,4)<=year)
    .sort((a,b)=>a.periodo.localeCompare(b.periodo));
  const baseFactor = adjusted ? priceYearFactor(data,state.baseYear) : 1;
  const label = adjusted?`Pesos promedio de ${state.baseYear}`: monetary?'Pesos corrientes':unit;
  const history = series.map(row=>({...row,valor:row.valor/baseFactor}));
  const observations = history.filter(row=>row.periodo.slice(0,4)===year);
  const frequency = period=>period.includes('-S')?'semester':period.includes('-')?'month':'year';
  const chartFrequency = observations.some(row=>frequency(row.periodo)==='month') ? 'month' : frequency(observations.at(-1)?.periodo??'');
  return {monetary,label,rows:observations,chart:observations.length?history.filter(row=>frequency(row.periodo)===chartFrequency):[]};
}

function csvRows(rows,state,catalog=topics) {
  const unit = state.unit==='real'?`pesos promedio de ${state.baseYear}`:'pesos corrientes';
  const cut = state.measure==='initial'||state.cut==='annual'?'anual':'enero a junio';
  const header = ['concepto','indicador','corte','año','unidad','monto','participación porcentual','estado','alcance','ajuste','comparado con','variación porcentual','fuente'];
  const values = rows.flatMap(row=> {
    const common = [measures[state.measure],cut,row.year,unit];
    return row.detail?.length
      ? row.detail.map(item=>[item.label,...common,item.value,item.share,item.status,`${item.reference} · ${item.scope}`,item.inflation,null,null,item.source])
      : [[catalog[state.topic].name,...common,row.value,row.share,row.status,row.scope,row.inflation,row.priorYear,row.pct,row.source]];
  });
  return [header,...values].map(row=>row.map(value=>`"${(typeof value==='number'?String(value).replace('.',','):String(value??'')).replaceAll('"','""')}"`).join(';')).join('\r\n')+'\r\n';
}

function budgetTrend(rows){
  const values = rows.filter(row=>Number.isFinite(row.value));
  if(!values.length) return '';
  const low = Math.min(0,...values.map(row=>row.value));
  const high = Math.max(0,...values.map(row=>row.value));
  const divisor = high-low || 1;
  const bottom = low===high?164:172;
  const chartX = i=>123+(rows.length===1?.5:i/(rows.length-1))*392;
  const chartY = value=>bottom-(value-low)/divisor*145;
  const ticks = high===low?[0]:[high,(high+low)/2,low];
  const lines = rows.map((row,i)=>{
    const next = rows[i+1];
    if(!Number.isFinite(row.value)||!Number.isFinite(next?.value)) return '';
    return `<line x1="${chartX(i)}" y1="${chartY(row.value)}" x2="${chartX(i+1)}" y2="${chartY(next.value)}" class="budget-line ${next.year===2027?'projected':''}"/>`;
  }).join('');
  return `<svg class="budget-chart" viewBox="0 0 550 206" role="img" aria-label="${safe(values.map(row=>row.year+' · '+millions(row.value)+' millones').join('; '))}">
  ${ticks.map(tick=>`<line x1="121" x2="521" y1="${chartY(tick)}" y2="${chartY(tick)}" class="gridline"/>
  <text x="112" y="${chartY(tick)+4}" text-anchor="end">${num(tick/1e6)}</text>`).join('')}
  ${low<0&&high>0?`<line x1="121" x2="521" y1="${chartY(0)}" y2="${chartY(0)}" class="zero-line"/>`:''}
  ${lines}${rows.map((row,i)=>`<text x="${chartX(i)}" y="197" text-anchor="middle">${row.year}</text>${Number.isFinite(row.value)?
    `<circle cx="${chartX(i)}" cy="${chartY(row.value)}" r="5.5" class="budget-dot ${row.year===2027?'projected':''}"><title>${row.year} · ${millions(row.value)} millones</title></circle>`:''}`).join('')}</svg>`;
}

  <div class="layout"><section><h2>Documentos de ${state.year}</h2><ul class="source-list">${list.map(([title,link,note])=>`<li>${sourceLink(link,title)}<small>${safe(note)}</small></li>`).join('')}</ul></section>
  <article class="lead detail"><h2>Cómo se comparan los montos</h2>
  <details open><summary>Ajuste por inflación</summary><p class="muted">Aplicamos el IPC NOA. El monto corriente se multiplica por el IPC medio del año base elegido dividido por el IPC medio del período. El ajuste anual usa el escenario central. El acumulado semestral se ajusta con el promedio de ese semestre como aproximación.</p>
  <ul class="source-list">${data.deflators.map(d=>`<li>${d.ejercicio} · ${d.meses_observados} meses observados · ${d.meses_proyectados} proyectados</li>`).join('')}</ul><p class="method">${sourceLink('https://www.bcra.gob.ar/archivos/Pdfs/PublicacionesEstadisticas/informes/relevamiento-expectativas-mercado-2026-10.pdf','REM de octubre de 2026')}</p></details>
  <details><summary>Crédito, ejecución y anuncios</summary><p class="muted">El crédito inicial se consulta en la ley o en el proyecto cuando se indica. El crédito vigente incorpora modificaciones. El devengado registra una obligación de pago. Los anuncios se presentan con su fecha y su propio alcance.</p></details>
  <details><summary>Cómo se calcula la participación</summary><p class="muted">Cada partida de gasto se divide por el gasto total previsto o por el total del mismo indicador y corte. Cada recurso se divide por los ingresos totales previstos. Como ambos montos del año usan el mismo factor de precios, el porcentaje se conserva en pesos corrientes y constantes.</p></details>
  <details><summary>Proyecto y datos pendientes</summary><p class="muted">La base incorpora agregados, jurisdicciones y construcciones del proyecto 2027. Las cifras con distinto alcance se muestran con su fuente y sin variación interanual. La ejecución requiere un corte publicado. La variación indica el año anterior seleccionado que se tomó como base. Las celdas sin dato quedan vacías en la descarga.</p></details></article></div>`;
}

function fullView(){
  const annual = {...state,selected:years,measure:'initial',cut:'annual'};
  const roots = ['recursos','total','saldo'];
  const read = key=>compareRows(data,{...annual,topic:key});
  const [resources,spending,balances] = roots.map(read);
  const amount = row=>Number.isFinite(row.value)?millions(row.value):row.detail?.length?'Ver proyecto':'—';
  const resultLabel = value=>value>0?'Superávit previsto':value<0?'Déficit previsto':'Resultado equilibrado';

  function treeRow(key){
    const group = budgetGroups[key];
    const topic = group??catalog[key];
    const rows = group?[]:read(key);
    const children = budgetTree[key]??[];
    const sourceRows = rows.flatMap(row=>row.detail?.length
      ? row.detail.map(item=>({...item,year:row.year}))
      : row.source?[row]:[]);
    return `<details class="budget-node" data-budget-node="${key}" ${openedBudgetNodes.has(key)?'open':''}>
      <summary class="budget-summary ${group?'budget-group':''}"><span class="budget-label"><span class="disclosure" aria-hidden="true"></span>${safe(topic.name)}</span>
        ${rows.map(row=>`<span class="budget-cell"><span class="budget-cell-year">${row.year}</span><span class="${Number.isFinite(row.value)?'price':'muted'}">
          ${amount(row)}${Number.isFinite(row.share)?`<small class="muted">${safe(percent(row.share))}</small>`:''}</span></span>`).join('')}</summary>
      <div class="budget-children">
        ${topic.note?`<p class="note">${safe(topic.note)}</p>`:''}
        ${key==='recursos'?'<p class="note">En 2026, el artículo 2 y la Planilla 8 distribuyen $740 de forma distinta entre recursos corrientes y de capital. El total de ingresos coincide.</p>':''}
        ${rows.some(row=>row.detail?.length)?`<div class="project-detail"><h3>2027 · Importes del proyecto</h3>
          ${rows.flatMap(row=>row.detail??[]).map(item=>valueRow(item.label,{...item,scope:item.reference})).join('')}
          <p class="note">Los anexos del proyecto usan otro alcance.</p></div>`:''}
        ${children.map(treeRow).join('')}
        ${!group?`<div class="budget-row-actions"><button type="button" class="text-button" data-compare-topic="${key}">Comparar</button>
          ${sourceRows.map(row=>sourceLink(row.source,row.label?`${row.year} · ${row.label}`:`${row.year} · Fuente`)).join('')}</div>`:''}
      </div></details>`;
  }

  return `<div class="hero"><div><h1>Vista completa</h1><p class="sub">Ingresos, gastos y resultado de los tres presupuestos</p></div>${moneyControls(state)}</div>
  <div class="results">
    <section class="lead"><h2>Cuánto entra, cuánto se gasta y cuánto queda</h2>
      <p class="muted">${moneyUnits(state)}</p>${baseNote(state)}
      <div class="year-overview">${years.map((year,i)=>`<article class="year-card balance-card">
        <h3 class="year-tag">${year} · ${year===2027?'Proyecto':'Ley'}</h3>
        <dl><div><dt>Recursos</dt><dd class="price">${amount(resources[i])}</dd></div>
        <div><dt>Gastos</dt><dd class="price">${amount(spending[i])}</dd></div>
        <div class="balance-line"><dt>${resultLabel(balances[i].value)}</dt><dd class="price">${amount(balances[i])}</dd></div></dl>
        ${resources[i].inflation?`<small class="muted">${safe(resources[i].inflation)}</small>`:''}</article>`).join('')}</div>
    </section>
    <section class="lead budget-structure"><h2>Abrir el presupuesto por rubro</h2>
      <p class="muted">Abrí cada fila para ver el detalle y las fuentes. Los porcentajes indican cuánto pesa la partida dentro del total de ingresos o gastos del año.</p>
      <div class="budget-column-head" aria-hidden="true"><span>Concepto</span>${years.map(year=>`<span>${year} · ${year===2027?'Proyecto':'Ley'}</span>`).join('')}</div>
      ${roots.map(treeRow).join('')}
      ${Object.keys(budgetGroups).map(treeRow).join('')}
      <small class="muted">— indica que el rubro no está identificado en ese desglose. Los importes provienen de la ley y sus anexos o del proyecto.</small>
    </section>
    <div class="actions"><button type="button" class="secondary" data-tab="indicadores">Ver indicadores sociales</button><button type="button" class="text-button" data-tab="fuentes">Fuentes y metodología</button></div>
  </div>`;
}

function periodLabel(period){
  const [year,part] = period.split('-');
  if(!part) return year;
  if(part.startsWith('S')) return `${part.slice(1)}.º semestre ${year}`;
  return new Intl.DateTimeFormat('es-AR',{month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(`${period}-01T00:00:00Z`));
}
function trend(series){
  const rows = series.chart;
  if(!rows.length) return '';
  const first=rows[0],last=rows.at(-1);
  const difference = last.valor-first.valor;
  const change=series.label==='%'?`${pctFormat.format(difference)} p.p.`:first.valor===0?null:`${pctFormat.format(difference/first.valor*100)}%`;
  const low = Math.min(...rows.map(row=>row.valor));
  const high = Math.max(...rows.map(row=>row.valor));
  const padding = (high-low)*.14 || Math.max(Math.abs(high)*.07,1);
  const bottom = Math.max(0,low-padding);
  const top = high+padding;
  const time = period => {
    const [year,cut] = period.split('-');
    const withinYear = cut?.startsWith('S')?Number(cut.slice(1))*6:Number(cut??0);
    return Number(year)*12+withinYear;
  };
  const duration = time(last.periodo)-time(first.periodo) || 1;
  const points = rows.map(row=>[75+284*(time(row.periodo)-time(first.periodo))/duration,154-(row.valor-bottom)/(top-bottom)*127]);
  const ticks=[top,(top+bottom)/2,bottom];
  return `<section class="trend" aria-label="Evolución del indicador">
   <div class="trend-head"><div><small class="muted">Último dato · ${periodLabel(last.periodo)}</small><strong>${num(last.valor)}${series.label==='%'?'%':''}</strong><small class="muted">${safe(series.label)}</small></div>
   ${rows.length>1&&change!==null?`<div><small class="muted">Cambio en el tramo</small><strong>${change}</strong><small class="muted">Desde ${periodLabel(first.periodo)}</small></div>`:''}</div>
   ${rows.length>1?`<svg class="series-chart" viewBox="0 0 380 184" role="img" aria-label="Desde ${periodLabel(first.periodo)} hasta ${periodLabel(last.periodo)}. Cambio de la serie en ${safe(series.label)}.">
   ${ticks.map((tick,i)=>`<line x1="75" x2="359" y1="${27+i*63.5}" y2="${27+i*63.5}" class="gridline"/><text x="69" y="${30+i*63.5}" text-anchor="end">${num(tick)}</text>`).join('')}
   <polyline points="${points.map(p=>p.join(',')).join(' ')}" class="series-stroke"/>
   ${points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.6"><title>${periodLabel(rows[i].periodo)} · ${num(rows[i].valor)}</title></circle>`).join('')}
   <text x="75" y="176">${periodLabel(first.periodo)}</text><text x="359" y="176" text-anchor="end">${periodLabel(last.periodo)}</text></svg>`:''}</section>`;
}

function indicators(){
  const indicator = indicatorKeys.includes(state.social) ? state.social : 'Incidencia de pobreza en personas';
  const series = indicatorRows(data,state,indicator);
  const rows = [...series.rows].reverse();
  return `<button class="back" type="button" data-tab="inicio">Volver a Inicio</button><div class="hero"><div><h1>Indicadores sociales</h1><p class="sub">Jujuy · datos observados por fuente y cobertura</p></div>${yearButtons([state.year],'year')}</div>
  <div class="results"><article class="lead">
  <label class="select-label">Indicador<select id="indicator">${indicatorKeys.map(name=>`<option ${name===indicator?'selected':''}>${safe(name)}</option>`).join('')}</select></label>
  ${series.monetary?moneyControls(state)+baseNote(state):''}
  ${rows.length?`${trend(series)}<div class="table-scroll"><table><thead><tr><th>Período</th><th>Valor · ${safe(series.label)}</th><th>Cobertura y fuente</th></tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${periodLabel(r.periodo)}</th><td>${num(r.valor)}${series.label==='%'?'%':''}</td><td>${safe(r.cobertura)}<br>${sourceLink(r.fuente,'Abrir fuente')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Sin observaciones incorporadas para este indicador y año.</p>'}</article></div>`;
}

const views = {inicio:home,tema:topicView,completa:fullView,comparar:compare,fuentes:sources,indicadores:indicators};
function render(focus = false){
  const localId = document.activeElement?.id;
  const dataAttrs = {...document.activeElement?.dataset};
  for(const node of main.querySelectorAll('[data-budget-node]')){
    if(node.open) openedBudgetNodes.add(node.dataset.budgetNode);
    else openedBudgetNodes.delete(node.dataset.budgetNode);
  }
  main.innerHTML = views[state.tab]();
  const tab = ['tema','indicadores'].includes(state.tab)?'inicio':state.tab;
  nav.innerHTML = [['inicio','Inicio','home'],['completa','Vista completa','overview'],['comparar','Comparar','chart']].map(([key,text,g])=>
    `<button class="nav-item" type="button" data-nav="${key}" ${key===tab?'aria-current="page"':''}>${icon(g)}${text}</button>`).join('');
  if(focus){
    const heading = main.querySelector('h1');
    heading.tabIndex = -1;
    heading.focus({preventScroll:true});
    window.scrollTo(0,0);
  } else if(['indicator','base-year','compare-topic'].includes(localId)) document.getElementById(localId)?.focus({preventScroll:true});
  else if(Object.keys(dataAttrs).length) {
    const target = [...main.querySelectorAll('button')].find(button=>Object.entries(dataAttrs).every(([key,value])=>button.dataset[key]===value));
    target?.focus({preventScroll:true});
  }
}

function update(delta,{push=false,focus=false}={}){
  state = {...state,...delta};
  history[push?'pushState':'replaceState'](null,'',stateHash(state));
  render(focus);
}

function openFilters(topic){
  draft = {...state,topic,measure:catalog[topic].execution?state.measure:'initial',
    selected:[...(state.tab==='completa'?years:state.selected)]};
  drawFilters();
  dialog.showModal();
  dialog.querySelector('#topic-select').focus();
}

function drawFilters(focusSelector){
  const options = (entries,active)=>entries.map(([key,label])=>`<option value="${key}" ${key===active?'selected':''}>${label}</option>`).join('');
  dialog.innerHTML = `<form id="filter-form"><header><h2 id="filter-title">Comparar años</h2><button class="round" type="button" data-close aria-label="Cerrar">${icon('close')}</button></header>
  <label class="select-label">Partida o indicador<select id="topic-select" data-draft="topic">${topicOptions(draft.topic)}</select></label>
  <fieldset><legend>Años · elegí al menos dos</legend>${yearButtons(draft.selected,'draft-year')}</fieldset>
  <div class="filters-grid"><label>Indicador<select data-draft="measure" ${catalog[draft.topic].execution?'':'disabled'}>${options(Object.entries(measures),draft.measure)}</select></label>
  <label>Período<select data-draft="cut" ${draft.measure!=='accrued'?'disabled':''}>${options([['semester','Enero a junio'],['annual','Anual']],draft.measure==='accrued'?draft.cut:'annual')}</select></label></div>
  <fieldset><legend>Valores</legend>${unitButtons(draft.unit,'draft-unit')}${basePicker(draft,'data-draft="baseYear"')}</fieldset>
  <p class="hint">2027 figura como proyecto. La ejecución se muestra cuando hay un corte publicado.</p>
  <p role="alert" id="filter-message"></p><button class="primary" type="submit">Ver comparación</button></form>`;
  if(focusSelector) dialog.querySelector(focusSelector)?.focus();
}

function download(){
  const contents = csvRows(variations(compareRows(data,state)),state,catalog);
  const href = URL.createObjectURL(new Blob(['\ufeff',contents],{type:'text/csv;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = href;
  link.download = `jujuy-${state.topic}-${state.measure}-${state.unit}.csv`;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(href),1000);
}
function toast(message){
  status.textContent=message;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>status.textContent='',4200);
}
async function share(){
  if(location.protocol==='file:'){
    toast('El enlace compartido estará disponible al publicar el sitio.');
    return;
  }
  const link = new URL(location.href);
  link.hash = stateHash(state);
  try {
    if(navigator.share) {await navigator.share({title:'Presupuesto Jujuy',url:link.href});return;}
    if(navigator.clipboard){await navigator.clipboard.writeText(link.href);toast('Enlace copiado');return;}
  } catch(error){if(error.name==='AbortError') return;}
  window.prompt('Copiá el enlace de esta vista',link.href);
}

document.querySelector('#share').innerHTML=icon('share');
document.querySelector('#share').addEventListener('click',share);
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();});
document.addEventListener('click',event=>{
  const button = event.target.closest('button');
  if(!button)return;
  const b=button.dataset;
  if(b.tab) update({tab:b.tab},{push:true,focus:true});
  if(b.nav) update({tab:b.nav},{push:true,focus:true});
  if(b.filter) openFilters(b.filter);
  if(b.topic) update({tab:'tema',topic:b.topic,panel:'presupuesto'},{push:true,focus:true});
  if(b.compareTopic) update({tab:'comparar',topic:b.compareTopic,measure:'initial',selected:[...years]},{push:true,focus:true});
  if(b.year) update({year:Number(b.year)});
  if(b.unit) update({unit:b.unit});
  if(b.panel) update({panel:b.panel});
  if('download' in b) download();
  if('sources' in b) update({tab:'fuentes'},{push:true,focus:true});
  if('close' in b) dialog.close();
  if(b.draftYear){
    const y=Number(b.draftYear);
    draft.selected=draft.selected.includes(y)?draft.selected.filter(n=>n!==y):years.filter(n=>n===y||draft.selected.includes(n));
    button.setAttribute('aria-pressed',String(draft.selected.includes(y)));
    dialog.querySelector('#filter-message').textContent='';
  }
  if(b.draftUnit){
    draft.unit=b.draftUnit;
    drawFilters(`[data-draft-unit="${draft.unit}"]`);
  }
});
document.addEventListener('change',event=>{
  const field=event.target.dataset.draft;
  if(field){
    draft[field]=field==='baseYear'?Number(event.target.value):event.target.value;
    if(field==='measure'){
      if(draft.measure==='currentCredit') draft.cut='annual';
      if(draft.measure==='accrued') draft.cut='semester';
      drawFilters('[data-draft="measure"]');
    }
    if(field==='topic'){
      if(!catalog[draft.topic].execution) draft.measure='initial';
      drawFilters('#topic-select');
    }
  }
  if(event.target.id==='base-year') update({baseYear:Number(event.target.value)});
  if(event.target.id==='indicator') update({social:event.target.value});
  if(event.target.id==='compare-topic'){
    const topic=event.target.value;
    update({topic,measure:catalog[topic].execution?state.measure:'initial'});
  }
});
dialog.addEventListener('submit',event=>{
  event.preventDefault();
  if(draft.selected.length<2){
    dialog.querySelector('#filter-message').textContent='Seleccioná dos o tres años.';
    return;
  }
  dialog.close();
  update({...draft,tab:'comparar'},{push:true,focus:true});
});
dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
window.addEventListener('hashchange',()=>{state=parseState(location.hash,catalog);render(true);});
render();
</script>
</body>
</html>
